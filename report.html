// агрегаты по строкам: доходимость и конверсия — только по строкам, где заполнены и каюты, и люди / заявки
function obAgg(rows){
  const a={n:rows.length,held:0,off:0,wait:0,ppl:0,tot:0,pres:0,gen:0,qr:0,flat:0,lead:0,cabP:0,pplC:0,cabT:0,totC:0,rub:0,rubN:0};
  rows.forEach(r=>{if(r.st===1)a.held++;else if(r.st===0)a.off++;else if(r.tot==null)a.wait++;
    a.ppl+=r.ppl||0;
    if(r.tot!=null){a.tot+=r.tot;a.lead++;if(r.pres==null&&r.gen==null&&r.qr==null)a.flat+=r.tot}
    a.pres+=r.pres||0;a.gen+=r.gen||0;a.qr+=r.qr||0;
    if(r.cab>0&&r.ppl!=null){a.cabP+=r.cab;a.pplC+=r.ppl}
    if(r.cab>0&&r.tot!=null){a.cabT+=r.cab;a.totC+=r.tot}
    if(r.rub!=null){a.rub+=r.rub;if(r.rub>0)a.rubN++}});
  a.reach=a.cabP?a.pplC/a.cabP:null;a.conv=a.cabT?a.totC/a.cabT:null;a.per=a.lead?a.tot/a.lead:null;
  return a;
}
// рейс в одном виде: «26–28 июня», «25 июня – 1 июля»; пометка из таблицы («(до Казани)», «часть 2») — отдельно
const MON_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function obCruise(r){
  if(!r.cs||!r.ce)return{range:r.cr,rest:''};
  const d1=+r.cs.slice(8),d2=+r.ce.slice(8),m1=+r.cs.slice(5,7)-1,m2=+r.ce.slice(5,7)-1;
  const range=m1===m2?`${d1}–${d2}\u00a0${MON_G[m2]}`:`${d1}\u00a0${MON_G[m1]} – ${d2}\u00a0${MON_G[m2]}`;
  let rest=r.cr.replace(/^\s*\d{1,2}\s*[а-яё]*\.?\s*[-–—]\s*\d{1,2}\s*[а-яё]+\.?\s*/i,'').replace(/^[.,;\s]+/,'').replace(/^\((.*)\)$/,'$1').trim();
  if(rest)rest=rest.charAt(0).toUpperCase()+rest.slice(1);
  return{range,rest};
}

/** «Качество данных» внизу каждой вкладки, свёрнуто (как в NPS). Раскрывается само при ошибке или устаревшем источнике. */
function dqBlock(){
  const d=x=>x?dShort(x)+' '+x.slice(0,4):'—';
  const ageH=a=>a?(Date.now()-new Date(a).getTime())/36e5:null;
  const age=h=>h==null?'—':h<1?'меньше часа назад':h<48?Math.round(h)+' ч назад':Math.round(h/24)+' дн назад';
  const W=[];
  (D.updates||[]).forEach(u=>{const h=ageH(u.at);
    if(u.error)W.push({level:'bad',text:`${u.source}: ошибка обновления — ${u.error}`});
    else if(h!=null&&h>30)W.push({level:'warn',text:`${u.source}: обновлено ${age(h)} (${u.at.replace('T',' ')}) — ночное обновление не сработало?`});
    else W.push({level:'ok',text:`${u.source}: обновлено ${age(h)}, ${fmt(u.rows)} строк`})});
  W.push({level:'info',text:`Визиты из Метрики — с ${d(D.days[0])}; шаги воронки сайта (цели VBI) — с ${d(D.site.steps_from)}`});
  W.push({level:'info',text:`Заявки с сайта из букинга — с ${d(D.zav_from)}; обращения из Битрикса — в основном с декабря 2025 (${fmt(D.obr.junk)} дублей и ошибок исключено)`});
  const WB=D.webinars||{};W.push(WB.error?{level:'warn',text:'Мероприятия: '+WB.error}:{level:'ok',text:`Мероприятия: ${(WB.list||[]).length} в справочнике, прочитаны при сборке отчёта`});
  (WB.list||[]).filter(x=>x.outLeads).forEach(x=>W.push({level:'warn',text:`Мероприятия · ${x.name}: лиды Битрикса с его «Типом лида» вне окна мероприятия (за 14 дней до — 30 после) — ${x.outLeads}. Не засчитаны: проверьте дату в справочнике или не висит ли старая форма на сайте`}));
  const OB=D.onboard||{};W.push(OB.error?{level:'warn',text:'Продажи с бортов: '+OB.error}:{level:'ok',text:`Продажи с бортов: прочитано листов ${fmt((OB.used||[]).length||1)} — ${fmt((OB.rows||[]).length)} ${plural((OB.rows||[]).length,'строка','строки','строк')} графика, ${fmt((OB.summaries||[]).length)} ${plural((OB.summaries||[]).length,'строка','строки','строк')} сводок, броней ${fmt(sum((OB.sales||[]).map(x=>x.n)))}${OB.fixed?`; дат с опечаткой поправлено по датам рейса: ${OB.fixed}`:''}`});
  {const bad=(OB.rows||[]).filter(x=>x.tot!=null&&(x.pres!=null||x.gen!=null||x.qr!=null)&&x.tot!==(x.pres||0)+(x.gen||0)+(x.qr||0));
   if(bad.length)W.push({level:'warn',text:`Продажи с бортов: в ${fmt(bad.length)} ${plural(bad.length,'строке','строках','строках')} главного графика «общее кол-во заявок» не равно сумме видов — `+bad.slice(0,5).map(x=>`${x.ship}, ${x.cr}: ${fmt(x.pres||0)}+${fmt(x.gen||0)}${x.qr?'+'+fmt(x.qr):''} ≠ ${fmt(x.tot)}`).join('; ')+(bad.length>5?' …':'')+'. В итоги идёт «общее кол-во».'})}
  (OB.checks||[]).forEach(c=>W.push(c.same+c.missing===c.rows&&!c.missing&&!c.diffs.length?{level:'ok',text:`Продажи с бортов: лист «${c.sheet}» совпадает с главным графиком (${fmt(c.rows)} ${plural(c.rows,'строка','строки','строк')})`}:{level:'warn',text:`Продажи с бортов: лист «${c.sheet}» расходится с главным графиком — ${c.diffs.join('; ')}`}));
  if((OB.dupSheets||[]).length)W.push({level:'info',text:`Продажи с бортов: лист ${OB.dupSheets.map(x=>'«'+x+'»').join(', ')} повторяет месячные сводки — новых строк не дал`});
  if((OB.skipped||[]).length)W.push({level:'warn',text:`Продажи с бортов: не прочитаны листы ${OB.skipped.map(x=>'«'+x+'»').join(', ')} — новый вид листа, нужна доработка`});
  W.push({level:'info',text:'Источник каждой заявки по ClientID — есть с августа 2026, в отчёт ещё не подключён'});
  W.push({level:(D.spend||[]).length?'ok':'info',text:(D.spend||[]).length?'Расходы: лист «Расходы» заполнен':'Расходов нет — лист «Расходы»; карточки CPA, ДРР, ROMI пока серые'});
  W.push({level:(D.plan||[]).length?'ok':'info',text:(D.plan||[]).length?'План: лист «План» заполнен':'Плана нет — лист «План»'});
  W.push({level:'info',text:'Сравнения с периодами до начала данных не показываются, чтобы конверсия не искажалась'});
  const lv={bad:0,warn:1,ok:2,info:3},open=W.some(w=>w.level==='bad'||w.level==='warn');
  return`<details class="panel dq"${open?' open':''}><summary>Качество данных · ${W.length}</summary><p class="sub" style="margin-top:6px">Откуда данные, когда обновлялись и с какой даты есть</p><ul>${[...W].sort((a,b)=>lv[a.level]-lv[b.level]).map(w=>`<li class="${w.level}"><span>${esc(w.text)}</span></li>`).join('')}</ul></details>`;
}

/* ---------- Telegram: initData из страницы-обёртки ---------- */
/* Обёртка может быть не самым верхним окном: в веб-версии Telegram цепочка web.telegram.org → обёртка → script.google.com → отчёт.
   Поэтому сообщения шлём всем родительским окнам, а ответ принимаем от любого из них. */
const SZ_UP=(()=>{const a=[];let w=window;try{while(w!==w.parent&&a.length<6){w=w.parent;a.push(w)}}catch(e){}return a})();
function toWrap(msg){SZ_UP.forEach(w=>{try{w.postMessage(msg,'*')}catch(e){}})}
let SZ_LOGIN='';   // вход из браузера (виджет Telegram Login в обёртке): «login:…»
const TG_INIT=new Promise(res=>{
  if(window.top===window){res('');return}
  let got=false;
  addEventListener('message',e=>{if(SZ_UP.indexOf(e.source)<0||!e.data)return;
    if(e.data.type==='sz-tg'){got=true;fsState(e.data);if(e.data.go)GO=String(e.data.go);res(e.data.initData||'')}
    if(e.data.type==='sz-fs')fsState(e.data);
    if(e.data.type==='sz-login'&&/^login:/.test(e.data.initData||'')){SZ_LOGIN=String(e.data.initData);load(false)}
    if(e.data.type==='sz-go'){GO=String(e.data.go);if(D){histPush();applyGo()}}});   // новая ссылка в открытом приложении
  try{toWrap({type:'sz-hello'})}catch(e){}
  setTimeout(()=>{if(!got)res('')},800);
});
function authMsg(e){
  const m=String(e&&e.message||e);
  if(/AUTH_DENIED:(\d+)/.test(m))return`<b>Нет доступа к отчёту.</b> Ваш Telegram ID: <b>${m.match(/AUTH_DENIED:(\d+)/)[1]}</b>. `+({sent:'Запрос отправлен администратору — когда он подтвердит, бот пришлёт сообщение.',repeat:'Запрос уже отправлен недавно.',noadmin:'В списке доступа нет администратора — передайте этот ID ему.'}[(m.match(/AUTH_DENIED:\d+:(\w+)/)||[])[1]]||'Передайте этот ID администратору.');
  if(/AUTH_TG/.test(m)){   // нужен вход: обёртка в браузере покажет кнопку «Войти через Telegram» для этого бота
    const bot=(m.match(/AUTH_TG:([A-Za-z0-9_]{3,})/)||[])[1]||'';
    if(window.top!==window&&bot)try{toWrap({type:'sz-need-login',bot:bot})}catch(e){}
    return'<b>Нужен вход.</b> В Telegram — откройте отчёт заново кнопкой в чате с ботом. В браузере — нажмите «Войти через Telegram» и подтвердите вход в Telegram (вход запомнится на 7 дней).'}
  if(/AUTH_SETUP/.test(m))return'<b>Доступ ещё не настроен.</b> '+esc(m.replace(/^.*AUTH_SETUP:\s*/,''));
  return null;
}
/* Последний ответ сервера хранится на устройстве (IndexedDB, {v: метка содержимого, d: JSON}): при открытии отчёт рисуется
   сразу из него, свежие данные приходят следом и заменяют его, только если отличаются. Нет доступа — копия стирается. */
const LC_KEY='sa-last';let LC_SHOWN='';
function lcDb(){return new Promise((res,rej)=>{const r=indexedDB.open('sz-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function lcGet(){if(!window.indexedDB)return Promise.resolve(null);return lcDb().then(db=>new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(LC_KEY);q.onsuccess=()=>{const v=q.result;res(v?typeof v==='string'?{v:'',d:v}:v:null)};q.onerror=()=>res(null)})).catch(()=>null)}
function lcPut(v){lcDb().then(db=>{const s=db.transaction('kv','readwrite').objectStore('kv');v==null?s.delete(LC_KEY):s.put(v,LC_KEY)}).catch(()=>{})}
/* Этап 2 (#58): страница лежит на GitHub Pages рядом с обёрткой, данные — запросом к Apps Script: GET ?fn=data
   (doGet → saApiGet_; doPost занят экспортом CRS). SZ_API (адрес /exec) подставляет сборка tools/miniapp_build.py.
   have — метка содержимого копии на устройстве: сервер ответит {"__same":1,"g":…} без данных, если она не изменилась.
   Обёртка начинает тот же запрос сразу при открытии (SZ_PREFETCH) — страница забирает его ответ, а не ждёт свой. */
function szApi(fn,args){
  const q=new URLSearchParams({fn});Object.keys(args).forEach(k=>{if(args[k]!==''&&args[k]!=null&&args[k]!==false)q.set(k,args[k]===true?'1':args[k])});
  return fetch(window.SZ_API+'?'+q,{redirect:'follow',credentials:'omit',cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('Сервер ответил '+r.status);return r.text()}).then(szErr)}
function szErr(t){if(t.startsWith('{"__error"'))throw new Error(JSON.parse(t).__error);return t}
function szPrefetch(init){try{const p=parent!==window&&parent.SZ_PREFETCH;if(p&&p.init===init){parent.SZ_PREFETCH=null;return p.res.then(szErr)}}catch(e){}return null}
// подписи заглушки меняются, пока данных нет (первое открытие на устройстве)
const SK_MSG=['Загружаю данные…','Собираю заявки из букинга…','Считаю воронку сайта…','Сверяю обращения из Битрикса…','Строю прогноз месяца…'];
(function skRun(k){const el=document.getElementById('sk-msg');if(!el||D)return;
  setTimeout(()=>{const e=document.getElementById('sk-msg');if(!e||D)return;e.style.opacity=0;
    setTimeout(()=>{e.textContent=SK_MSG[(k+1)%SK_MSG.length];e.style.opacity=1;skRun(k+1)},250)},1600)})(0);
function load(force){
  document.body.classList.add('busy');
  const btns=document.querySelectorAll('.js-refresh:not(.js-refresh-m)'),mb=document.querySelector('.js-refresh-m');
  btns.forEach(b=>{b.disabled=true;b.textContent='Обновляю…'});
  if(mb){mb.disabled=true;mb.classList.add('busy');mb.querySelector('.t-full').textContent='Обновляю…';mb.querySelector('.t-short').textContent='Обновляю…'}
  const reset=()=>{document.body.classList.remove('busy');btns.forEach(b=>{b.disabled=false;b.textContent='Обновить данные'});
    if(mb){mb.disabled=false;mb.classList.remove('busy');mb.querySelector('.t-full').textContent='Обновить данные';mb.querySelector('.t-short').textContent='Обновить'}};
  let fresh=false;   // ответ сервера уже пришёл — копию с устройства не показываем
  const fail=e=>{reset();fresh=true;const a=authMsg(e);
    if(a){lcPut(null);LC_SHOWN='';D=null}
    else if(D&&LC_SHOWN){stamp(false);$('#stamp').textContent+=' · не удалось обновить';return}   // остаются показанные данные
    $('#filters').innerHTML='';$('#view').innerHTML=a?`<div class="err">${a}</div>`:`<div class="err"><b>Не удалось загрузить данные.</b> ${esc(e&&e.message||e)}</div>`};
  const done=(res,cached,ver)=>{if(cached&&fresh)return;
    const str=typeof res==='string'?res:JSON.stringify(res);
    if(!cached){reset();fresh=true;lcPut({v:ver||'',d:str});if(str===LC_SHOWN&&D){stamp(false);return}}
    try{D=JSON.parse(str);LC_SHOWN=str;stamp(cached);
    const dd=x=>x?x.slice(8,10)+'.'+x.slice(5,7)+'.'+x.slice(0,4):'—';
    const pe=$('#period');pe.hidden=false;pe.innerHTML=`<b>Объём данных.</b> Заявки с сайта ${dd(D.zav_from)}–${dd(D.today)} · ${nf.format(sum(D.zav.total))} заявок · визиты с ${dd(D.days[0])} · ${nf.format(D.obr.rows.length)} обращений`;
    if(!applyGo())render()}catch(e){if(cached){D=null;LC_SHOWN='';lcPut(null);return}fail(e)}};
  const stamp=wait=>{const g=new Date(D.generated_at),p2=n=>String(n).padStart(2,'0');
    $('#stamp').textContent=`Данные на ${p2(g.getDate())}.${p2(g.getMonth()+1)}.${g.getFullYear()} ${p2(g.getHours())}:${p2(g.getMinutes())}`+(wait?' · обновляю…':'')};
  const lc=!force&&!D?lcGet():Promise.resolve(null);
  lc.then(v=>{if(v)done(v.d,true)});
  // ответ сервера: {"__v":"…","d":{…}} — данные; {"__same":1,"g":"…"} — копия на устройстве актуальна, сборка от g
  const got=(t,init)=>{
    if(t.startsWith('{"__same"'))return lc.then(v=>{if(!v)return szApi('data',{init}).then(t2=>got(t2,init));
      const g=JSON.parse(t).g;if(D&&LC_SHOWN===v.d){reset();fresh=true;if(g)D.generated_at=g;stamp(false);return}
      done(v.d,false,v.v);if(g&&D){D.generated_at=g;stamp(false)}});
    const m=t.match(/^\{"__v":("(?:[^"\\]|\\.)*"),"d":/);
    return m?done(t.slice(m[0].length,-1),false,JSON.parse(m[1])):done(t,false,'')};
  if(window.google&&google.script&&google.script.run)TG_INIT.then(i=>SZ_LOGIN||i).then(init=>google.script.run.withSuccessHandler(done).withFailureHandler(fail).getReportData(!!force,init));
  else if(window.SZ_API)Promise.all([TG_INIT.then(i=>SZ_LOGIN||i),lc]).then(([init,v])=>
    ((!force&&szPrefetch(init))||szApi('data',{force:!!force,init,have:v&&v.v||''})).then(t=>got(t,init))).catch(fail);   // страница с GitHub Pages
  else if(window.SA_PAYLOAD)setTimeout(()=>done(window.SA_PAYLOAD),0);
  else fail('Страница открыта вне Apps Script, данных нет.');
}

// Подвал «Как считается» — как в NPS: короткие пункты сеткой (на телефоне — столбиком)
$('#method').innerHTML='<div id="dq-slot"></div><p id="period" class="ref-info" hidden></p><h3>Как считается</h3><dl>'+[
  ['Заявка','Бронь, которую турист оформил сам на сайте.','Заявка из букинга, созданная на сайте (отметка «создана на сайте»), по дате создания. Номера и данные клиентов в отчёт не попадают.'],
  ['Оплачена','Турист внёс предоплату или всю сумму.','Текущий статус «Оплачено» или «Предоплата». Аннулированные и возвраты — отдельно. Сумма — полная стоимость заявки, маржа — из букинга.'],
  ['Когорта заявок сайта','Кем был человек в день заявки на сайте и что купил потом.','Человек — аккаунт в Букинге с заявкой сайта за период; день 0 — его первая заявка сайта в периоде. Группа — по истории до дня 0: новые (заявок не было), оформлял, не покупал (круизов не было), покупали только других операторов, покупатели Созвездия (последний круиз меньше 2 лет назад), вернувшиеся (2 года и больше); «круиз был» — статусы 20, 21, 30, 31. После — все заявки человека с дня 0, включая саму заявку сайта: заявок / оплачено (Предоплата, Оплачено; срок — по первой оплате), доля Созвездия с Речными линиями. Служебные аккаунты (больше 20 разных покупателей на аккаунт) не считаются. Обновляется ночью.'],
  ['Когорта обращений','Кем был человек в день обращения и что купил потом.','Обращения — звонки, Макс, Телеграм без дублей и ошибок, как карточка «Обращения». Человек — контакт Битрикса (у лида без контакта — сам лид), контакты с общим телефоном или почтой — один человек; в Букинге — покупатель заявки из лида или сделки и покупатели с тем же телефоном или почтой. День 0 — первое обращение человека в периоде. Группы и сроки — как у когорты заявок сайта; не нашли в Букинге — «новые». Обновляется ночью.'],
  ['Первая заявка или уже оформлял','Новый ли это для нас человек.','«Первая заявка» — первая заявка пользователя в букинге за всё время. Иначе — «уже оформлял» (была любая заявка раньше, даже неоплаченная). Повторный покупатель (была оплаченная заявка раньше) — в отчёте «Продукт».'],
  ['Воронка сайта','На каком шаге сайта люди уходят, не дойдя до заявки.','Визиты и цели Метрики по дням: цены и бронирование → бронирование → оформление → данные туристов → данные заказчика → оформить. Конверсия шага — от предыдущего шага.'],
  ['Визит → заявка','Из скольких заходов на сайт получается одна заявка.','Заявки с сайта / визиты за те же дни. Сегодняшний неполный день не учитывается.'],
  ['Обращения','Сколько звонков и сообщений было по делу и сколько из них дошли до заявки.','Лиды Битрикса из листа «Обращения» без дублей, ошибок и вопросов о сотрудничестве. Целевое — отметка «Целевой»; до заявки — есть номер заявки букинга.'],
  ['Заявок вчера','Как прошёл последний рабочий день по сравнению с обычным.','Последний будний день: в воскресенье и понедельник — пятница, заявки субботы и воскресенья показаны отдельно. Ниже — сколько было в будний день перед ним. Норма — среднее число заявок в будний день за последние 4 недели. Сегодняшний день не показывается: букинг обновляется раз в сутки.'],
  ['Сравнение с прошлым месяцем','Честное сравнение: те же дни и столько же времени на оплату.','В сводке — те же полные дни прошлого месяца, без сегодняшнего (он ещё идёт). Оплаты прошлого месяца — какими они были на тот же день: заявка считается оплаченной, если первый платёж пришёл не позже. Иначе прошлый месяц всегда выглядел бы лучше — у его заявок было больше времени.'],
  ['Прогноз месяца','Сколько заявок будет к концу месяца, если всё пойдёт как обычно.','Факт + оставшиеся дни × среднее число заявок в день за 28 дней с поправкой на день недели (12 недель). Коридор и «обычно ошибается на ±…» — по проверке того же расчёта на прошлых месяцах на это же число: в 8 из 10 месяцев итог попадал в коридор. На 12 месяцах (окт 2025 – сен 2026) средняя ошибка ±25% на 5-е число, ±16% на 15-е, ±6% на 25-е; систематически прогноз не завышает и не занижает.'],
  ['Где отвал','Что просело за последнюю неделю — и не случайно ли.','Последние 7 полных дней против нормы — 28 дней до них. Жёлтый — падение на 7%+, красный — на 15%+, и только если оно больше случайного разброса.'],
  ['Сравнение','С чем сравниваем выбранный период.','Текущий месяц — с теми же днями прошлого; месяц — с предыдущим; остальные периоды — с таким же отрезком перед ними. До начала данных сравнение не показывается.'],
  ['Мероприятия','Сколько людей пришло на вебинар или экскурсию и сколько из них купили.','Таблица мероприятий (вебинары и экскурсия на теплоход). Экскурсия: регистрации с формы и брони менеджеров, участник — по почте или телефону (одна почта или один телефон — один человек), гости — по действующим броням, число гостей и статус — по Букингу; места по сеансам — в обработке / подтверждено / оплачено (в сумме = гостей в бронях) («Статусы броней» таблицы экскурсии), обновляется каждые 15 минут с 8 до 22, срез — по номерам броней, «оплачено» — билет на экскурсию. Вебинары: регистрации без повторов по почте; база ИФ, оплата СЗ, заявка и стадия Б24 — из проверок «Букинг» и «Битрикс»; «новые» — первая заявка в ИФ после старта регистрации; продажи — срез Б24 (предоплата или оплата сделки).'],
  ['Участники мероприятия','Сколько разных людей зарегистрировалось.','Строка листа регистраций — одна отправка формы. Человек — по почте (без почты — по телефону, последние 10 цифр); у экскурсии одна почта или один телефон — один человек. Повторные отправки склеиваются, дата регистрации — самая ранняя («повторных регистраций убрано: N»). Один человек с двумя разными почтами считается дважды.'],
  ['Участник в Букинге','Как мы находим, что человек покупал.','Почта и телефон участника превращаются в хэш (SHA-256) — в Букинг уходит только он — и сравниваются с покупателями Букинга. Совпала почта или телефон — это его карточка покупателя; у одного человека их может быть несколько, берутся все. «Нашлись в Букинге» — у скольких есть карточка. Кто без покупок, в Букинге без контактов — для них берётся «Есть в базе ИФ» из таблицы мероприятий.'],
  ['Воронка и когорта мероприятия','Что пришло через сам вебинар и что эти люди купили вообще.','Воронка — только путь через вебинар: лид с типом вебинара в Битриксе → номер заявки в лиде → оплачена ли эта заявка в Букинге (Предоплата или Оплачено; разные заявки, одна заявка у двух лидов — один раз). Когорта — все заявки тех же людей в Букинге с дня мероприятия, любым путём; считаем людей. Заявки между регистрацией и мероприятием — отдельно («до мероприятия»), в «купили» не входят. Поэтому в когорте покупок больше. Переключатель «Что считаем»: по умолчанию круизы; отдельно — доп. услуги к круизу (дочерняя заявка к круизу без пассажиров), билеты «В гости на теплоход», сертификаты, авиабилеты, визы, прочее или всё вместе.'],
  ['Кто пришёл и когда купил','Кем был человек в день регистрации и через сколько дней купил.','Сегмент — по круизам до дня регистрации: новые (не было в базе), в базе без покупок, покупали только других операторов, покупатели Созвездия (последняя покупка меньше 2 лет назад), вернувшиеся (2 года и больше). Созвездие — вместе с Речными линиями. В ячейке — заявок / оплачено заявок: до мероприятия (между регистрацией и мероприятием) и за срок после дня мероприятия; оплата — статусы «Предоплата» и «Оплачено», срок — по дню первой оплаты. «Купили, людей» — человек один раз. Обновляется ночью.'],
  ['Продажи с бортов','Сколько заявок приносят презентации на теплоходах.','Таблица «График PRO_движ», все листы. График: строка — презентация; доходимость — люди / занятые каюты, конверсия — заявки / занятые каюты (где каюты заполнены). Год к году — месячные сводки («Мария»). Брони — листы «…_продажи с бортов». Рабочие листы месяцев сверяются с графиком.'],
  ['Расходы и окупаемость','Окупается ли реклама (заработает, когда появятся расходы).','CPA — расход / заявки; ДРР — расход / оплачено ₽; ROMI — (маржа − расход) / расход. Из листа «Расходы», пока без привязки заявки к каналу.'],

/** Телефон: название — в одну строку; кнопка обновления ужимается, пока строка заголовка не влезет. */
function fitHeader(){
  const h1=document.querySelector('.brand h1'),ma=document.querySelector('.m-actions'),t=h1&&h1.querySelector('.h1-title');
  if(!h1||!ma||!t)return;
  t.style.fontSize='';
  if(getComputedStyle(ma).display==='none')return;
  // название не сжимается: сравниваем его полную ширину + кнопки с шириной строки
  const fits=()=>{const gap=parseFloat(getComputedStyle(h1).columnGap)||12;return t.scrollWidth+gap+ma.getBoundingClientRect().width<=h1.clientWidth+1};
  for(const mode of ['','fit-short','fit-icon']){
    ma.classList.remove('fit-short','fit-icon');if(mode)ma.classList.add(mode);
    if(fits())return;
  }
  // кнопка уже кружок, а не влезает — уменьшаем шрифт названия (не мельче 17 px)
  for(let px=parseFloat(getComputedStyle(t).fontSize)-1;px>=17&&!fits();px--)t.style.fontSize=px+'px';
}
addEventListener('resize',fitHeader);
/** Фильтры ушли под прилипшую строку вкладок — переносим сам блок фильтров в эту строку (обработчики остаются),
 *  на его месте — пустое место той же высоты, чтобы страница не прыгала. Блок — общий #filters или .pin-f внутри вкладки
 *  («Продажи с бортов», «Мероприятия»). Телефон: строка вкладок не прилипает — не переносим. */
let PIN=null;
function pinTarget(){const g=document.getElementById('filters');return g&&g.innerHTML.trim()?g:document.querySelector('#view .pin-f')}
function unpinFilters(){const sp=document.getElementById('filters-sp');if(!sp&&!PIN)return;
  if(sp)PIN?sp.replaceWith(PIN):sp.remove();if(PIN)PIN.classList.remove('pinned-f');PIN=null;document.body.classList.remove('pinned');navHeight()}
function pinFilters(){const n=document.getElementById('tabs'),f=PIN||pinTarget();if(!f||!n)return;
  const sp=document.getElementById('filters-sp'),at=(sp||f).getBoundingClientRect();
  const on=innerWidth>760&&!f.dataset.nopin&&at.bottom<n.getBoundingClientRect().bottom;
  if(on&&!sp){const s=document.createElement('div'),cs=getComputedStyle(f),h0=n.getBoundingClientRect().height;s.id='filters-sp';
    s.style.height=(f.offsetHeight+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom))+'px';
    f.replaceWith(s);f.classList.add('pinned-f');n.appendChild(f);PIN=f;document.body.classList.add('pinned');navHeight();
    if(n.getBoundingClientRect().height>h0*2.2){unpinFilters();f.dataset.nopin='1'}}   // фильтры заняли бы больше двух строк — остаются на месте
  else if(!on&&sp)unpinFilters()}
addEventListener('scroll',pinFilters,{passive:true});addEventListener('resize',()=>{unpinFilters();delete document.getElementById('filters').dataset.nopin;markWide();pinFilters()});
/** Вкладки не помещаются в одну строку — фильтры в прилипшей строке встают отдельной строкой под ними (не вперемешку с вкладками). */
function navSplit(n){const b=n.querySelectorAll(':scope>button');if(!b.length)return;n.classList.remove('split','split2');
  const t0=b[0].offsetTop,o=[...n.children].find(x=>x.tagName!=='BUTTON'&&x.getClientRects().length);
  // не помещается в одну строку: вкладки переносятся, фильтры ушли под вкладки или подпись в фильтре обрезана многоточием
  const cut=o&&[...o.querySelectorAll('*')].some(e=>e.scrollWidth>e.clientWidth+1&&getComputedStyle(e).textOverflow==='ellipsis');
  if(innerWidth<=760||![...b].some(x=>x.offsetTop!==t0)&&!(o&&(o.offsetTop>=t0+b[0].offsetHeight||cut)))return;
  // 60 на 40: слева вкладки (60 %, до двух строк), справа фильтры (40 %, до двух строк); не влезло — фильтры своей строкой
  if(o){n.classList.add('split2');const h=Math.ceil(o.getBoundingClientRect().height);n.style.setProperty('--fh',h+'px');
    if(new Set([...b].map(x=>x.offsetTop)).size<=2&&h<=90)return;n.classList.remove('split2')}
  n.classList.add('split')}
function navHeight(){const n=document.getElementById('tabs');if(!n)return;navSplit(n);document.documentElement.style.setProperty('--nav-h',n.getBoundingClientRect().height+'px')}
addEventListener('resize',navHeight);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitHeader);

render();load(false);navState();fitHeader();navHeight();
window.__szBoot=1;
