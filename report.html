  --navy:#103A60;--aqua:#00B9E7;--orange:#F16522;--link:#00799B;--accent:#103A60;--accent-soft:#EDF2F6;
  --good:#17804D;--good-soft:#E4F2EA;--warn:#B05E00;--warn-soft:#FBEEDD;--bad:#C93333;--bad-soft:#FBE7E7;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#8e5bd6;--s1-soft:#cde2fb;
  --display:"Montserrat","Roboto",Arial,sans-serif;--body:"Roboto",Arial,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0A1A2B;--surface:#0F2438;--surface2:#16304A;--ink:#EAF1F6;--ink2:#B7C6D3;--muted:#8799A9;--line:#23405C;
  --navy:#7FB3DD;--aqua:#00B9E7;--orange:#F47A44;--link:#4FC8EC;--accent:#5CC4EA;--accent-soft:#16344D;
  --good:#3CC08A;--good-soft:#123A2C;--warn:#F0A13C;--warn-soft:#3A2A14;--bad:#F06A6A;--bad-soft:#3E1D22;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#a37ae8;--s1-soft:#1c3f66;}
html,body{background:var(--bg);max-width:100%}
html{overflow-x:hidden}body{overflow-x:hidden;overflow-x:clip}   /* clip, а не hidden: hidden у body ломает прилипание вкладок и заголовков таблиц */
*{box-sizing:border-box}
body{margin:0;color:var(--ink2);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 130px}   /* снизу — место под кнопки «Назад» и «Наверх» */

/* Шапка — как в NPS-отчёте: полоса бренда, название, «Данные на …» и значки справа, легенда уровней */
.wrap::before{content:"";display:block;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--navy) 0 60%,var(--aqua) 60% 85%,var(--orange) 85%);margin:-20px 0 18px}
@media (max-width:560px){.wrap::before{margin-top:-16px}}
header.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"title refresh" "legend legend";align-items:start;row-gap:6px;margin-bottom:18px}
.brand{display:contents}
.brand h1{grid-area:title;font:600 22px/1.2 var(--display);color:var(--navy);margin:0;text-wrap:balance;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1 .h1-sub{font:500 14px/1.2 var(--body);color:var(--muted);padding-left:12px;border-left:3px solid var(--orange)}
/* Справка об объёме данных — в подвале, между «Качеством данных» и «Как считается» */
footer.method .ref-info{margin:0 0 20px;padding:12px 16px;border-radius:10px;background:var(--surface2);color:var(--ink2);font-size:13px;line-height:1.5}
footer.method .ref-info b{font-weight:600;color:var(--ink)}

  header.top .refresh{justify-content:flex-start;padding-top:0;margin-bottom:6px;gap:4px}}
/* До 760 px (телефон и узкое окно Telegram): все действия — в строке названия, размер кнопок — от ширины экрана */
@media (max-width:760px){
  .brand h1{flex-wrap:wrap;justify-content:space-between;gap:2px 12px;min-width:0}

  /* Кнопка обновления ужимается по месту: «Обновить данные» → «Обновить» → кружок со стрелкой (класс ставит fitHeader) */

  .m-actions.fit-short .js-refresh-m .t-full,.m-actions.fit-icon .js-refresh-m .t-full,.m-actions.fit-icon .js-refresh-m .t-short{display:none}
  .m-actions.fit-short .js-refresh-m .t-short{display:inline}
  .m-actions.fit-icon .js-refresh-m .t-icon{display:block;width:1.4em;height:1.4em}

  /* Телефон: «Обновить данные» и тема — рядом в строке заголовка, одной высоты; размеры в em — растут вместе с масштабом шрифта */

  .m-actions .btn.icon-btn svg{width:1.4em;height:1.4em}
  header.top .refresh #btn-theme{display:none}
  header.top .refresh #btn-refresh{display:none}header.top .refresh #stamp{flex:1 1 auto}}
@media (max-width:560px){.legend-zones{display:grid;grid-template-columns:1fr 1fr}.legend-zones .pill{justify-content:center;padding:4px 8px}}
.refresh{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap}
.btn{font:500 13px var(--body);color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:progress}
.btn.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border:0;background:transparent;border-radius:50%;line-height:0}

.zoom{display:inline-flex;align-items:center;gap:0}.zoom .icon-btn{font:600 18px/1 var(--body);color:var(--accent)}
.btn.zoom-val{border:0;background:transparent;padding:6px 4px;min-width:46px;font-variant-numeric:tabular-nums}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-auto-flow:column;grid-auto-columns:max-content;justify-content:start;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{font:600 13.5px var(--display);min-height:40px;color:var(--ink2);background:none;border:1px solid transparent;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface2)}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:#FFFFFF}
nav.tabs button:focus:not(:focus-visible){outline:none}
/* Фильтры при прокрутке — в строке вкладок (компьютер; как в «Продукте» v26): блок #filters переезжает в прилипшую строку */
@media (min-width:761px){nav.tabs{display:flex;flex-wrap:wrap;align-items:center}
  nav.tabs>.pinned-f{margin:0 0 0 auto;padding:0 0 0 20px;max-width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 8px}
  nav.tabs>.pinned-f .filters{margin:0;gap:6px 8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  nav.tabs>.pinned-f .flbl,nav.tabs>.pinned-f #period-note,nav.tabs>.pinned-f .muted:not(.pick-n):not(.pk-s):not(.pk-f):not(.pk-short){display:none}
  nav.tabs>.pinned-f>label,nav.tabs>.pinned-f .filters>label,nav.tabs>.pinned-f .fgroup{font-size:0;gap:0;min-width:0}
  nav.tabs>.pinned-f>label>*,nav.tabs>.pinned-f .filters>label>*,nav.tabs>.pinned-f .fgroup>*{font-size:13px}
  nav.tabs>.pinned-f select{padding:0 28px 0 10px;background-position:right 9px center;box-sizing:border-box}   /* в прилипшей строке списки мельче — отступы пропорционально меньше */
  nav.tabs>.pinned-f select,nav.tabs>.pinned-f input:not([type=checkbox]),nav.tabs>.pinned-f details.pick{height:36px;box-sizing:border-box;min-width:0;max-width:200px;font-size:13px}
  nav.tabs>.pinned-f .grow{flex:0 1 200px}
  nav.tabs>.pinned-f .seg,nav.tabs>.pinned-f .checks{min-height:0;padding:2px}
  nav.tabs>.pinned-f button,nav.tabs>.pinned-f .checks label{font:500 13px var(--body);min-height:30px;padding:0 8px;white-space:nowrap}
  nav.tabs>.pinned-f .seg.hm{display:none}nav.tabs>.pinned-f .mini{display:block;width:170px}nav.tabs>.pinned-f #sel-month{width:170px;min-width:0}nav.tabs>.pinned-f .range input{width:170px;flex:none}   /* капсулы 36 px, списки одной ширины */
  nav.tabs>.pinned-f div:has(>.range:not(.on)){display:none}   /* «Свой период» в строке вкладок — только когда выбран */
  nav.tabs>.pinned-f details.pick{margin:0;padding:6px 14px;position:relative;border-radius:10px}
  nav.tabs>.pinned-f details.pick summary{column-gap:6px;border-radius:6px;outline-offset:3px}
  nav.tabs>.pinned-f details.pick .pick-n{display:none}nav.tabs>.pinned-f details.pick .pk-short{display:inline;font:600 12.5px var(--body);white-space:nowrap}   /* свёрнуто: «регистраций/продаж» */
  /* строки выпадающего списка — обычные отступы (правило «кнопки в строке вкладок мелкие» их не касается) */
  nav.tabs>.pinned-f .pick-list{gap:6px}nav.tabs>.pinned-f .pick-list button{padding:10px 14px;min-height:0;font:500 14px var(--body);white-space:normal;align-items:baseline}
  nav.tabs>.pinned-f details.pick summary{font:600 13px/1.3 var(--display);flex-wrap:nowrap;max-width:300px}nav.tabs>.pinned-f details.pick summary>span:first-of-type{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}nav.tabs>.pinned-f details.pick .pick-n{white-space:nowrap}nav.tabs>.pinned-f details.pick .pick-n{font-size:12px}
  nav.tabs>.pinned-f details.pick[open] .pick-list{position:absolute;right:0;top:100%;margin-top:6px;width:min(560px,90vw);max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:10}
  body.pinned nav.tabs>button{padding:8px 9px}}
@media (min-width:761px){nav.tabs.split>.pinned-f,nav.tabs.split>#filters,nav.tabs.split>.nav-f{flex-basis:100%;margin-left:0;justify-content:flex-end}   /* вкладки в несколько строк — фильтры своей строкой */}
/* вкладки с фильтрами не помещаются в одну строку — 60 на 40 (23.10.2026): слева вкладки (60 %) (переносятся, до двух строк),
   справа фильтры на 40 % ширины (тоже до двух строк), капсулы делят её поровну; вкладкам мало двух строк — .split */
@media (min-width:761px){nav.tabs.split2{padding-right:40%;min-height:calc(var(--fh,0px) + 16px);box-sizing:border-box;align-content:center}
  nav.tabs.split2>:not(button){position:absolute;right:0;top:50%;transform:translateY(-50%);width:calc(40% - 16px);max-width:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 8px}
  nav.tabs:is(.split,.split2)>:not(button) .filters{display:contents}
  nav.tabs:is(.split,.split2)>:not(button) .filters>*,nav.tabs:is(.split,.split2)>:not(button)>:not(.filters):not(.flbl){flex:1 1 calc(50% - 4px);min-width:0}
  nav.tabs:is(.split,.split2)>:not(button) select,nav.tabs:is(.split,.split2)>:not(button) #sel-month,nav.tabs:is(.split,.split2)>:not(button) .mini{width:100%;max-width:none}
  nav.tabs:is(.split,.split2)>:not(button) div:has(>.range.on){flex-basis:100%}   /* свой период: даты второй строкой, каждая — как список над ней */
  nav.tabs:is(.split,.split2)>:not(button) .range.on{display:flex;width:100%;gap:8px}nav.tabs:is(.split,.split2)>:not(button) .range.on>span{display:none}
  nav.tabs:is(.split,.split2)>:not(button) .range.on input{flex:1 1 0;width:auto;min-width:0;max-width:none}
  nav.tabs:is(.split,.split2)>:not(button)>details.pick{max-width:none;flex:1 1 100%;display:flex;align-items:center;justify-content:center;padding-block:0;height:36px;box-sizing:border-box}
  nav.tabs:is(.split,.split2)>:not(button) details.pick summary{max-width:none;justify-content:center}
  nav.tabs.split>:is(#filters,.pinned-f).pinned-f{flex-basis:auto;width:max(40%,420px);max-width:100%;margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 8px}   /* запасной вариант: фильтры своей строкой, справа на 40 % */
  /* пропорции как в Яндекс Метрике: капсулы 36 px, скругление 12, промежуток 8; капсула не ужимается меньше подписи — переносится строкой ниже */
  nav.tabs:is(.split,.split2)>:not(button){gap:8px}
  nav.tabs:is(.split,.split2)>:not(button) .filters>*,nav.tabs:is(.split,.split2)>:not(button)>:not(.filters):not(.flbl){min-width:140px}
  nav.tabs:is(.split,.split2)>:not(button) select,nav.tabs:is(.split,.split2)>:not(button) input:not([type=checkbox]),nav.tabs:is(.split,.split2)>:not(button) details.pick{border-radius:12px}}
@media (max-width:760px){nav.tabs{position:static;grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(3,1fr);justify-content:stretch}nav.tabs button{border-color:var(--line)}}

/* в таблицах: стрелка слева, число справа — колонка изменений ровная */
td .delta{display:inline-flex;justify-content:space-between;gap:6px;min-width:5.4em}td .delta.eq{min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.l-ok{color:var(--good);background:var(--good-soft)}.l-warn{color:var(--warn);background:var(--warn-soft)}.l-bad{color:var(--bad);background:var(--bad-soft)}.l-na{color:var(--muted);background:var(--surface2)}
.side h3{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 14px var(--display);color:var(--ink);margin:0 0 10px}
.sig{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sig li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:baseline;font-size:13px}
.sig li i{width:8px;height:8px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
.sig .ok i{background:var(--good)}.sig .warn i{background:var(--warn)}.sig .bad i{background:var(--bad)}.sig .na i{background:var(--line)}
.sig .v{white-space:nowrap;color:var(--ink)}.sig .v small{color:var(--muted);font-size:11.5px;margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend i.bar{height:10px;width:10px;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;height:2px}
svg[role="img"]{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ax{stroke:var(--line);stroke-width:1}
svg .hit{fill:transparent}
svg[role="img"]{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:crosshair}
svg .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
/* Навигация внутри вкладок: карточки и чипы ведут к блокам, строки и столбики выбирают месяц / теплоход / вебинар */
.kpi.go{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi.go .lbl{display:flex;justify-content:space-between;gap:8px}.kpi.go .lbl::after{content:"↓";color:var(--accent);font-size:13px;letter-spacing:0}
.kpi.go[data-go^="@"] .lbl::after{content:"→"}
.sig li[data-go],.side h3[data-go]{cursor:pointer;border-radius:6px}
@media (hover:hover){.sig li[data-go]:hover{background:var(--surface2)}.side h3[data-go]:hover{color:var(--accent)}}
@media (hover:hover){.kpi.go:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.07)}
  tr[data-pick]:hover td,.mix .row[data-pick]:hover{background:var(--surface2)}}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.jump button{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 12px;cursor:pointer}
@media (hover:hover){.jump button:hover{border-color:var(--accent);color:var(--accent)}}
.sec{scroll-margin-top:calc(var(--nav-h,57px) + 12px)}
svg text.mk{font-size:10.5px;font-weight:600;fill:var(--ink2);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.flash{animation:obflash 1.6s ease}
@keyframes obflash{0%,35%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
[data-pick]{cursor:pointer}.mix .row[data-pick]{border-radius:6px;margin:0 -6px;padding:2px 6px}
#c-board{cursor:pointer}
.mix{display:grid;gap:8px}
.mix .row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 64px 120px;gap:10px;align-items:center;font-size:13px}
.mix .bar{height:22px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.mix .bar i{display:block;height:100%}
.mix .n{text-align:right;color:var(--ink);font-weight:600}
.mix .cr{text-align:right;font-size:12.5px}
.mix .row.tot{padding-bottom:8px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.mix .row{grid-template-columns:1fr 64px;row-gap:4px}.mix .bar{grid-column:1/-1;order:3}.mix .cr{grid-column:1/-1;text-align:left}}
.funnel{display:grid;gap:8px}
.funnel .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px 90px;gap:10px;align-items:center;font-size:13px}
.funnel .bar{height:22px;background:var(--surface2);border-radius:4px;overflow:hidden;position:relative}
.funnel .bar i{position:absolute;top:0;bottom:0;left:0;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0}
.funnel .n{text-align:right;color:var(--ink);font-weight:600}
.funnel .cr{text-align:right;font-size:12.5px}
@media (max-width:560px){.funnel .row{grid-template-columns:1fr 64px;row-gap:4px}.funnel .bar{grid-column:1/-1;order:3}.funnel .cr{grid-column:1/-1;text-align:left}}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink2)}
th.r,td.r{text-align:right;white-space:nowrap}
td.b{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto}
/* Заголовки таблиц прилипают при прокрутке.
   Компьютер: к нижнему краю прилипшей строки вкладок (--nav-h ставит JS); таблица без своей прокрутки.
   Телефон/узкое окно: вкладки не прилипают, а таблица может быть шире экрана — у длинной таблицы своя
   прокрутка по высоте, заголовок прилипает к её верху. */
thead th{position:sticky;z-index:3;background:var(--surface);box-shadow:inset 0 -1px 0 var(--line)}
@media (min-width:761px){.tbl{overflow:visible}thead th{top:var(--nav-h,57px)}
  .tbl.wide{max-height:75vh;overflow:auto;overscroll-behavior:contain}.tbl.wide thead th{top:0}}   /* шире карточки — своя прокрутка (как в «Продукте» v26) */
@media (max-width:760px){.tbl{max-height:75vh;overflow:auto;overscroll-behavior:contain}thead th{top:0}}
/* «Места по сеансам» экскурсии: группы колонок (Букинг | брони | кто оформил | сверка), формулы над таблицей, полоса заполненности */
.seats .gl{border-left:2px solid var(--line)}
/* 12 колонок: заголовки в две строки, плотнее отступы; если всё равно шире панели — прокрутка внутри рамки, а не наружу */
.seats .tbl{overflow-x:auto;max-height:none}
.seats thead th{position:static}
.seats th{white-space:normal;line-height:1.25;vertical-align:bottom;min-width:56px}
.seats th,.seats td{padding:8px 7px}
.seats th:first-child,.seats td:first-child{padding-left:0}
.seats th:last-child,.seats td:last-child{padding-right:2px}
.seats td.eq{color:var(--ink);font-weight:700}
.seats tr.b td{color:var(--ink);font-weight:700}
.checks{display:inline-flex;align-items:stretch;flex-wrap:wrap;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;min-height:42px}
.checks label{display:inline-flex;align-items:center;gap:7px;padding:0 10px;border-radius:7px;font:500 14px var(--body);color:var(--ink2);cursor:pointer;white-space:nowrap}
.checks input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
@media (max-width:560px){.checks{width:100%}.checks label{padding:9px 10px}}
@media (hover:hover){.checks label:hover{background:var(--surface2)}}
.seg.wk{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.seg.wk button{white-space:nowrap;flex:0 0 auto}
.seg.wk button small{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
@media (max-width:560px){.seg.wk{display:flex;flex-direction:column;align-items:stretch;width:100%;overflow:visible}.seg.wk button{display:flex;justify-content:space-between;text-align:left;padding:9px 12px}}
.segt th{white-space:normal;line-height:1.25;vertical-align:bottom;min-width:64px}
.segt td{white-space:nowrap;vertical-align:top}
.segt td small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.segt tr.b td{color:var(--ink);font-weight:700}
.segt .gl{border-left:2px solid var(--line)}
.zcuts{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.zcuts-l{display:grid;gap:16px;min-width:0}
@media (max-width:760px){.zcuts{grid-template-columns:1fr}}
/* телефон: короткая таблица — кем был, людей, купили, всего; сроки (.lag) — только в полной версии (23.10.2026, просьба пользователя) */
@media (max-width:760px){.segt{max-height:none}.segt .lag{display:none}
  .segt th{min-width:0}.segt th,.segt td{padding-left:6px;padding-right:6px}
  .segt td:first-child{white-space:normal;padding-left:0}.segt td:last-child{padding-right:0}
  .segt td small{white-space:normal}
  .segt-m{display:block!important}}
.segt-m{display:none;margin:8px 0 0;font-size:12.5px;color:var(--muted)}
/* самые узкие телефоны (320 px): таблица чуть шире за счёт отступа панели, плотнее отступы и шрифт — помещается без прокрутки */
@media (max-width:380px){.segt{margin:0 -8px}.segt th,.segt td{padding-left:3px;padding-right:3px}.segt td:first-child{padding-left:0}.segt td:last-child{padding-right:0}
  .segt td{font-size:12.5px}.segt td small{font-size:11px}.segt th{font-size:10px;letter-spacing:.02em}}
.seats-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.4;color:var(--muted)}
.seats-f>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.seats-f b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--ink2);margin-bottom:2px}
.seats-f i{font-style:normal;color:var(--ink2);font-weight:500}
.sbar{display:flex;width:96px;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.sbar i{display:block;height:100%}
.sbw{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sbw .sbar{flex:none}   /* таблица не ужимает полосу уже заданной ширины */
.sbw small{display:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbar i.pr,.legend i.pr{background:var(--s1)!important;opacity:.45}
.crmtag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.seats-after{margin-top:16px}
.ss-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.ss-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ss{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ss-k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ss-v{font-size:22px;font-weight:700;color:var(--ink);margin:4px 0 2px;line-height:1.15}
.ss-v small{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:6px}
.ss-d{font-size:12.5px;color:var(--ink2);line-height:1.35}
.ss.ss-diff{background:var(--surface2)}
.ss-note{margin:10px 0 0}
details.dq.disc summary{flex-wrap:wrap;row-gap:2px}
.disc-sum{font-weight:400;font-size:12.5px}
.disc th{white-space:nowrap}
.disc{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
details.dq.disc summary{font-size:14px}
.disc h3{margin:0 0 2px;font-size:15px;color:var(--ink)}
.disc h4{margin:14px 0 2px;font-size:13px;color:var(--ink)}
/* одна подложка на весь блок: таблицы и их заголовки — без своего фона */
.disc table,.disc thead th{background:transparent}
.disc thead th{box-shadow:inset 0 -1px 0 var(--line)}
.disc .bk{display:inline-block;margin:2px 6px 2px 0;padding:1px 7px;border-radius:6px;font-size:12px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.disc a.bk{text-decoration:none}
@media (hover:hover){.disc a.bk:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}}
@media (max-width:1100px){.sbar{width:64px}}
@media (max-width:760px){.seats .sbar{width:clamp(80px,calc(100vw - 240px),160px);height:12px;border-radius:6px}.sbw small{display:inline}}   /* «занято/мест» — только на телефоне */
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;background:var(--surface2)}
.empty b{color:var(--ink2)}
.muted{color:var(--muted)}
.nw{white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:14px 16px;line-height:1.5}.err b{color:var(--ink)}
.loading{display:flex;gap:12px;align-items:center;padding:40px 0;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Заглушка при первом открытии (пока нет копии на устройстве): силуэт карточек и графика «дышит», подпись меняется —
   ожидание выглядит как сборка отчёта, а не как пустой экран */
.sk i{display:block;border-radius:6px;background:var(--surface2);position:relative;overflow:hidden}
.sk .sk-l{height:10px;margin:6px 0;width:80%}.sk .sk-v{height:30px;width:45%;margin:12px 0 10px}
.sk-bars{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:14px;border-bottom:1px solid var(--line)}
.sk-bars i{flex:1;border-radius:4px 4px 0 0;background:var(--s1-soft);transform-origin:bottom}
@media (max-width:560px){.sk-wrap .g-kpi .sk:nth-child(n+3){display:none}}
.sk-msg{color:var(--muted);text-align:center;margin:18px 0 0;min-height:1.4em;transition:opacity .25s}
@media (prefers-reduced-motion:no-preference){
  .sk i:not(.sk-bars i)::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.4s ease-in-out infinite}
  :root[data-theme="dark"] .sk i:not(.sk-bars i)::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
  .sk-bars i{animation:wave 1.3s ease-in-out infinite alternate;animation-delay:calc(var(--n)*-90ms)}
  /* загрузка и обновление: по полосе бренда бежит блик */
  body.busy .wrap::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent) 0 0/40% 100% no-repeat,linear-gradient(90deg,var(--navy) 0 60%,var(--aqua) 60% 85%,var(--orange) 85%);animation:stripe 1.1s linear infinite}
  /* появление вкладки: панели поднимаются по очереди, столбики растут от нуля, линии прорисовываются, полосы вытягиваются */
  .intro .panel{animation:rise .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*35ms)}
  .intro svg .bx{animation:grow .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*35ms + var(--d,0ms))}
  .intro svg .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards;animation-delay:calc(var(--k,0)*35ms + 200ms)}
  .intro svg .fd{animation:fade .6s ease-out both;animation-delay:calc(var(--k,0)*35ms + 450ms)}
  .intro .funnel .bar i,.intro .funnel .bar>div,.intro .sbar i{animation:wgrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*35ms + 120ms)}
  /* свежие данные отличаются от показанных: изменившиеся числа мягко подсвечиваются */
  .kpi .val.upd,.hero .big.upd{animation:upd 1.4s ease}
}
@keyframes shim{to{transform:translateX(100%)}}
@keyframes wave{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes stripe{from{background-position:-67% 0,0 0}to{background-position:167% 0,0 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes wgrow{from{width:0}}
@keyframes upd{0%,30%{color:var(--accent);text-shadow:0 0 12px var(--accent-soft)}}
.tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.45;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tip b{font-weight:600}.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.dq{margin-top:16px}
details.pick{padding:12px 16px}
details.pick summary{font:600 16px/1.3 var(--display);color:var(--navy);flex-wrap:wrap;column-gap:.3em}
details.pick summary .pick-n{flex-basis:auto}
details.pick .pick-n{font:500 14px var(--body)}
.pick-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
details.dq.pick li{display:block;padding:0;background:none;border-radius:0}details.dq.pick li::before{content:none}
.pick-list button{width:100%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;text-align:left;font:500 14px var(--body);color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:9px 12px;cursor:pointer}

.pick-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pick-list .muted{font-size:12.5px}
.pick-list .pk-s{white-space:nowrap}.pick-list .pk-f{display:none}
details.pick .pk-short{display:none}
@media (max-width:560px){details.pick summary .pick-n{flex-basis:100%}details.pick .pk-dot{display:none}.pick-list button{flex-direction:column;align-items:flex-start;gap:2px}.pick-list .pk-s{display:none}.pick-list .pk-f{display:block}}
footer.method .dq{margin:0 0 22px;font-size:14px;line-height:1.45;color:var(--ink2)}
footer.method{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
footer.method h3{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
footer.method dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 28px;margin:0}
footer.method dt{font-weight:600;color:var(--ink2);margin:0 0 2px}footer.method dd{margin:0}
footer.method .how{margin-top:3px;font-size:13px;color:var(--muted)}footer.method .how summary{cursor:pointer;color:var(--link);font-size:12.5px;width:max-content}footer.method .how[open] summary{margin-bottom:2px}
/* Навигация: «Назад» — к предыдущей вкладке, «Наверх» — в начало страницы */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:15;display:flex;flex-direction:column;gap:10px}
.fab button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);box-shadow:0 4px 14px rgba(16,58,96,.18);display:grid;place-items:center;cursor:pointer;padding:0}
.fab button[hidden]{display:none}
.fab svg{width:20px;height:20px}
@media print{.fab{display:none}}
@media (hover:hover){.btn:hover,.btn.icon-btn:hover,.fab button:hover{background:var(--accent-soft)}.pick-list button:hover{border-color:var(--line)}}
/* скрытая кнопка скрыта всегда — даже если её стиль задаёт display */
[hidden]{display:none!important}
details.dq summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:10px}
details.dq summary::-webkit-details-marker{display:none}
details.dq summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .15s ease;flex:none;margin-left:2px}
details.dq[open] summary::before{transform:rotate(45deg) translate(-2px,-2px)}

<script>
/* Сторож совместимости: если основной скрипт не запустился (старый встроенный браузер Telegram на Android, Windows, Linux),
   вместо вечной «загрузки» показываем, что обновить. Без новых возможностей языка — должен работать везде. */

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('ru-RU');
const fmt=(v,d=0)=>v==null||isNaN(v)?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);
const pct=(v,d=1)=>v==null||isNaN(v)?'—':fmt(v*100,d)+'%';
// неразрывные пробелы: сумма и «₽» не переносятся на разные строки
const rub=v=>v==null||isNaN(v)?'—':Math.abs(v)>=1e6?fmt(v/1e6,1)+'\u00a0млн\u00a0₽':nf.format(Math.round(v))+'\u00a0₽';
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_S=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monName=m=>MON[+m.slice(5,7)-1]+' '+m.slice(0,4);
const monShort=m=>MON_S[+m.slice(5,7)-1]+' '+m.slice(2,4);
const dShort=d=>+d.slice(8,10)+' '+MON_S[+d.slice(5,7)-1];
const sum=a=>a.reduce((x,y)=>x+y,0);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function delta(cur,prev,{inverse=false,asPct=true}={}){
  if(cur==null||prev==null||!prev)return'<span class="delta eq">нет сравнения</span>';
  const ch=(cur-prev)/prev,good=inverse?ch<0:ch>0,cls=Math.abs(ch)<0.005?'eq':good?'up':'dn';
  return`<span class="delta ${cls}">${ch>0?'▲':ch<0?'▼':'='} ${fmt(Math.abs(ch)*100,0)}%</span>`;
}

/* ---------- состояние ---------- */
let D=null;
const S={tab:'summary',period:'month'};
try{Object.assign(S,JSON.parse(localStorage.getItem('sa-state')||'{}'))}catch(e){}
const TABS=[['summary','Сводка'],['zav','Заявки'],['site','Сайт'],['obr','Обращения'],['web','Мероприятия'],['pay','Оплаты'],['board','Продажи с бортов'],['chan','Каналы и расходы']];
function save(){try{localStorage.setItem('sa-state',JSON.stringify(S))}catch(e){}}
// «Назад»: стек переходов между вкладками (вкладка + период), только в этой сессии
const HIST=[];
function go(tab){if(tab===S.tab)return;HIST.push({tab:S.tab,period:S.period,y:scrollY});if(HIST.length>30)HIST.shift();S.tab=tab;save();render();window.scrollTo({top:0});navState()}
function goBack(){const h=HIST.pop();if(!h)return;S.tab=h.tab;S.period=h.period;if(h.bm!=null){S.bm=h.bm;S.bs=h.bs}if(h.web!=null)S.web=h.web;save();render();window.scrollTo({top:h.y||0});navState()}
function navState(){$('#btn-back').hidden=!HIST.length;$('#btn-top').hidden=scrollY<400}
$('#btn-back').onclick=e=>{if(e.detail)e.currentTarget.blur();goBack()};
$('#btn-top').onclick=e=>{if(e.detail)e.currentTarget.blur();window.scrollTo({top:0,behavior:'smooth'})};
addEventListener('scroll',()=>{$('#btn-top').hidden=scrollY<400},{passive:true});

/* ---------- периоды ---------- */
// Быстрые периоды; ещё два вида задаются значением S.period: 'm:ГГГГ-ММ' — выбранный месяц, 'c:ГГГГ-ММ-ДД:ГГГГ-ММ-ДД' — свой период
const PERIODS=[['month','Текущий месяц'],['prev','Прошлый месяц'],['d30','30 дней'],['d90','90 дней'],['year','Год'],['all','Всё время']];
// [с, по] — индексы дней включительно; и такой же предыдущий период для сравнения
function range(p){
  const n=D.days.length,ti=n-1,today=D.today;
  const idx=d=>D.days.indexOf(d);
  const clamp=i=>Math.max(0,Math.min(ti,i));
  const monEnd=m=>{const d=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();return idx(m+'-'+String(d).padStart(2,'0'))};
  let a,b,label;
  if(p==='month'){a=idx(today.slice(0,7)+'-01');b=ti}
  else if(p==='prev'){const f=idx(today.slice(0,7)+'-01');b=f-1;a=idx(D.days[b].slice(0,7)+'-01')}
  else if(p==='d30'){b=ti-1;a=b-29}
  else if(p==='d90'){b=ti-1;a=b-89}
  else if(p==='year'){b=ti-1;a=b-364}
  else if(p==='all'){a=0;b=ti}
  else if(/^m:\d{4}-\d{2}$/.test(p)){const m=p.slice(2);a=idx(m+'-01');const e=monEnd(m);b=e<0?ti:e;label=monName(m)}
  else if(/^c:\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2}$/.test(p)){const[,f,t]=p.split(':');a=idx(f);b=idx(t);if(a<0)a=f<D.days[0]?0:ti;if(b<0)b=t>today?ti:0;if(b<a)[a,b]=[b,a];label='Свой период'}
  else {a=idx(today.slice(0,7)+'-01');b=ti}
  a=clamp(a);b=clamp(b);
  const len=b-a+1;
  // сравнение: текущий месяц — те же дни прошлого месяца; месяц — весь предыдущий месяц;
  // «всё время» — без сравнения; остальное — такой же отрезок прямо перед периодом
  let pa,pb;
  if(p==='all'){pa=-1;pb=-1}
  else if(p==='month'){const dm=+today.slice(8,10);const pf=idx(D.days[Math.max(0,a-1)].slice(0,7)+'-01');pa=pf;pb=Math.min(pf+dm-1,a-1)}
  else if(p==='prev'||p.startsWith('m:')){pb=a-1;pa=pb>=0?idx(D.days[pb].slice(0,7)+'-01'):-1}
  else {pb=a-1;pa=pb>=0?Math.max(0,pb-len+1):-1}
  if(pb<0||pa<0){pa=-1;pb=-1}
  return{a,b,pa,pb,label:label||(PERIODS.find(x=>x[0]===p)||[])[1],from:D.days[a],to:D.days[b]};
}
const rs=(arr,a,b)=>a<0||b<a?0:sum(arr.slice(a,b+1));
// сравнение честное, только если источник уже работал в начале прошлого периода
const since=(r,from)=>!!from&&r.pa>=0&&D.days[r.pa]>=from;
// карточки: «к 1–9 сентября: 45 заявок» — с чем сравниваем; ok=false — в прошлом периоде данных ещё нет
const MON_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function perTxt(a,b){if(a<0||b<0||a>b)return null;const x=D.days[a],y=D.days[b],d=v=>+v.slice(8,10);
  if(x.slice(0,7)===y.slice(0,7))return(a===b?d(x):d(x)+'–'+d(y))+'\u00a0'+MON_GEN[+x.slice(5,7)-1];
  return d(x)+'\u00a0'+MON_S[+x.slice(5,7)-1]+' – '+d(y)+'\u00a0'+MON_S[+y.slice(5,7)-1]}
const cmpLine=(r,ok,txt)=>{const p=perTxt(r.pa,r.pb);return`<div class="foot"><span>${ok&&p?`к ${p}: ${txt}`:p?'сравнить не с чем — в прошлом периоде данных ещё нет':'без сравнения'}</span></div>`};
const mutedLine=t=>t?`<div class="foot"><span class="muted">${t}</span></div>`:'';
const nw=(n,a,b,c)=>`${fmt(n)} ${plural(n||0,a,b,c)}`;
const obrFrom=()=>{let m=Infinity;D.obr.rows.forEach(x=>{if(x[0]<m)m=x[0]});
  // первый месяц, где обращений хотя бы 20 — раньше единичные записи
  const byM={};D.obr.rows.forEach(x=>{const k=D.days[x[0]].slice(0,7);byM[k]=(byM[k]||0)+1});
  const ok=Object.keys(byM).sort().find(k=>byM[k]>=20);return ok?ok+'-01':null};
function periodFilter(){
  const months=[...new Set(D.days.map(d=>d.slice(0,7)))].reverse();
  const isM=S.period.startsWith('m:'),isC=S.period.startsWith('c:');
  const[,cf,ct]=isC?S.period.split(':'):[,D.days[Math.max(0,D.days.length-31)],D.today];
  return`<div class="filters">
  <div><span class="flbl">Период</span><div class="seg hm" id="seg-period">${PERIODS.map(([k,l])=>`<button type="button" data-p="${k}" aria-pressed="${S.period===k}">${l}</button>`).join('')}</div>
   <select id="sel-period" class="mini" aria-label="Период">${PERIODS.map(([k,l])=>`<option value="${k}"${S.period===k?' selected':''}>${l}</option>`).join('')}${isM||isC?`<option value="" selected>${isM?'Месяц':'Свой период'}</option>`:''}</select></div>
  <label><span class="flbl">Месяц</span><select id="sel-month"><option value="">— выбрать —</option>${months.map(m=>`<option value="${m}"${isM&&S.period==='m:'+m?' selected':''}>${monName(m)}</option>`).join('')}</select></label>
  <div><span class="flbl">Свой период</span><div class="range${isC?' on':''}"><input type="date" id="c-from" value="${cf}" min="${D.days[0]}" max="${D.today}"><span>—</span><input type="date" id="c-to" value="${ct}" min="${D.days[0]}" max="${D.today}"></div></div>
  <div class="muted" style="font-size:12.5px;padding-bottom:10px;flex-basis:100%" id="period-note"></div></div>`;
}
function bindPeriod(){
  const el=$('#seg-period');if(!el)return;
  const set=p=>{if(p===S.period)return;HIST.push({tab:S.tab,period:S.period,y:scrollY});if(HIST.length>30)HIST.shift();S.period=p;save();render();navState()};
  el.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;if(e.detail)b.blur();set(b.dataset.p)};
  $('#sel-month').onchange=e=>{if(e.target.value)set('m:'+e.target.value)};
  $('#sel-period').onchange=e=>{if(e.target.value)set(e.target.value)};   // тот же выбор в строке вкладок (кнопки туда не помещаются)
  const onRange=()=>{const f=$('#c-from').value,t=$('#c-to').value;if(/^\d{4}-\d{2}-\d{2}$/.test(f)&&/^\d{4}-\d{2}-\d{2}$/.test(t))set('c:'+(f<=t?f+':'+t:t+':'+f))};
  $('#c-from').onchange=onRange;$('#c-to').onchange=onRange;
  const r=range(S.period),y=d=>dShort(d)+' '+d.slice(0,4);
  $('#period-note').textContent=`${r.label}: ${y(r.from)} – ${y(r.to)} · `+(r.pa<0?'без сравнения':`сравнение с ${y(D.days[r.pa])} – ${y(D.days[r.pb])}`);
}

/* ---------- подсказка ---------- */
const tip=$('#tip');
function showTip(html,ev){tip.innerHTML=html;tip.hidden=false;const z=parseFloat(document.documentElement.style.zoom)||1;
  const x=ev.clientX/z,y=ev.clientY/z,w=tip.offsetWidth,h=tip.offsetHeight,touch=ev.pointerType&&ev.pointerType!=='mouse';
  tip.style.left=Math.max(8,Math.min(touch?x-w/2:x+14,innerWidth/z-w-8))+'px';
  tip.style.top=(touch?Math.max(8,y-h-28):(y+h+20>innerHeight/z?y-h-12:y+14))+'px'}
function hideTip(){tip.hidden=true}
/**
 * Прокрутка значений графика мышью и пальцем. idx(px) — номер точки по x в координатах viewBox,
 * show(i, ev) — нарисовать выделение и подсказку, clear() — убрать.
 * На телефоне горизонтальное движение пальца листает значения, вертикальное — страницу (touch-action: pan-y).
 */
function bindScrub(svg,W,idx,show,clear){
  const at=ev=>{const r=svg.getBoundingClientRect();return idx((ev.clientX-r.left)/r.width*W)};
  const move=ev=>{const i=at(ev);if(i==null)return;scrubClear=clear;show(i,ev)};
  // без захвата указателя: палец, ушедший за край графика, не держит подсказку
  svg.addEventListener('pointerdown',ev=>{if(ev.pointerType!=='mouse'){try{svg.releasePointerCapture(ev.pointerId)}catch(e){}}move(ev)});
  svg.addEventListener('pointermove',move);
  svg.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse'){scrubClear=null;clear()}});
}
// касание вне графика — убрать подсказку (один слушатель на страницу)
let scrubClear=null;
document.addEventListener('pointerdown',ev=>{if(scrubClear&&!ev.target.closest('svg[role="img"]')){scrubClear();scrubClear=null}},{passive:true});
document.addEventListener('scroll',hideTip,{passive:true});

/* ---------- графики (SVG) ---------- */
// число делений шкалы: у максимумов 2,5 и 5 (250, 500, 5…) — пять ровных шагов, иначе четыре
function gridSteps(max){const n=max/Math.pow(10,Math.floor(Math.log10(max)));return Math.abs(n-2.5)<1e-9||Math.abs(n-5)<1e-9?5:4}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
/**
 * Линии по общей оси X. series: [{name,color,values,dash,area}], labels — подписи точек (для подсказки),
 * ticks — функция (i)→подпись или ''. Подсказка — перекрестье по ближайшей точке.
 */
/* Ширина графика — по месту на странице (CWID, меряет fitCharts после вставки), чтобы подписи были 11 px и на телефоне,
   а не сжимались вместе с рисунком 760 px; на узком экране график ниже. Подписи по оси X прорежены, чтобы не слипались. */
const CWID={};
function chartBox(id,height){const W=CWID[id]||760;return{W,H:Math.round(W<520?Math.min(height,Math.max(170,W*.62)):height)}}
function thinTicks(ticks,n,span){const has=[];for(let i=0;i<n;i++)if(ticks(i))has.push(i);const step=Math.max(1,Math.ceil(has.length*58/Math.max(1,span)));
  const keep=new Set(has.filter((_,k)=>k%step===0));return i=>keep.has(i)?ticks(i):''}
function lineChart(id,{labels,series,ticks,height=240,fmtV=v=>fmt(v),fmtA=v=>fmt(v),floor=1,marks=[]}){
  const{W,H}=chartBox(id,height),L=44,R=12,T=10,B=26,n=labels.length;ticks=thinTicks(ticks,n,W-L-R);
  const max=niceMax(Math.max(floor,...series.flatMap(s=>s.values.filter(v=>v!=null))));

/** Столбики: bars [{label, value, tip}] + необязательная линия поверх (line: {name,color,values}). */
function barChart(id,{bars,color,height=220,line,ticks,fmtV=v=>fmt(v),name}){
  const{W,H}=chartBox(id,height),L=44,R=12,T=10,B=26,n=bars.length;if(ticks)ticks=thinTicks(ticks,n,W-L-R);
  const max=niceMax(Math.max(1,...bars.map(b=>b.value),...(line?line.values.filter(v=>v!=null):[])));
  const bw=(W-L-R)/n,gap=Math.min(2,bw*.2),y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  const ST=gridSteps(max);for(let k=0;k<=ST;k++){const v=max*k/ST;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  bars.forEach((b,i)=>{const x0=L+i*bw+gap/2,w=Math.max(1,bw-gap),h=y(0)-y(b.value);
    g+=`<g class="bx" style="transform-origin:0 ${y(0)}px;--d:${Math.round(i*400/Math.max(1,n))}ms">`;
    const bar=(bx,bwid,v,fill,ring)=>{const hh=y(0)-y(v);if(hh<=0)return'';const r=Math.min(4,bwid/2,hh);
      return`<path d="M${bx},${y(0)}V${y(v)+r}Q${bx},${y(v)} ${bx+r},${y(v)}H${bx+bwid-r}Q${bx+bwid},${y(v)} ${bx+bwid},${y(v)+r}V${y(0)}Z" fill="${fill}"${ring?` stroke="${cssv('--surface')}" stroke-width="2"`:''}/>`};
    if(b.parts){
      // столбик из частей снизу вверх (parts: [[значение, цвет]]), верхняя непустая — со скруглением
      const top=b.parts.reduce((k,p,j)=>p[0]>0?j:k,-1);let acc=0;
      b.parts.forEach(([v,fill],j)=>{if(!(v>0))return;const y0=y(acc),y1=y(acc+v);acc+=v;
        if(j===top){const r=Math.min(4,w/2,y0-y1);g+=`<path d="M${x0},${y0}V${y1+r}Q${x0},${y1} ${x0+r},${y1}H${x0+w-r}Q${x0+w},${y1} ${x0+w},${y1+r}V${y0}Z" fill="${fill}"/>`}
        else g+=`<rect x="${x0}" y="${y1}" width="${w}" height="${y0-y1}" fill="${fill}"/>`});
    } else if(b.inner!=null&&b.inner>0){
      // накопительный столбик: снизу «из них» (inner), сверху остаток до value — вплотную
      const yi=y(Math.min(b.inner,b.value)),top=b.value>b.inner;
      if(top&&yi-y(b.value)>0){const r=Math.min(4,w/2,yi-y(b.value));
        g+=`<path d="M${x0},${yi}V${y(b.value)+r}Q${x0},${y(b.value)} ${x0+r},${y(b.value)}H${x0+w-r}Q${x0+w},${y(b.value)} ${x0+w},${y(b.value)+r}V${yi}Z" fill="${b.color||color}"/>`}
      g+=top?`<rect x="${x0}" y="${yi}" width="${w}" height="${y(0)-yi}" fill="${b.innerColor}"/>`:bar(x0,w,b.inner,b.innerColor);
    } else if(h>0)g+=bar(x0,w,b.value,b.color||color);
    g+='</g>';
    const t=ticks?ticks(i):'';if(t)g+=`<text x="${x0+w/2}" y="${H-6}" text-anchor="middle">${esc(t)}</text>`;
  });

  if(line){let d='',open=false;line.values.forEach((v,i)=>{if(v==null){open=false;return}const cx=L+i*bw+bw/2;d+=(open?'L':'M')+cx.toFixed(1)+','+y(v).toFixed(1);open=true});
    g+=`<path ${line.dash?'class="fd" stroke-dasharray="6 4"':'class="ln" pathLength="1"'} d="${d}" fill="none" stroke="${line.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>`}
  g+=`<rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/>`;
  setTimeout(()=>{const svg=document.getElementById(id);if(!svg)return;
    bindScrub(svg,W,px=>Math.max(0,Math.min(n-1,Math.floor((px-L)/bw))),(i,ev)=>{const b=bars[i];
      showTip(`<b>${esc(b.label)}</b><br>${b.inner!=null||b.parts?'':`<i style="background:${b.color||color}"></i>`}${esc(name||'')}: <b>${fmtV(b.value)}</b>`+(b.tip?'<br>'+b.tip:'')+(line&&line.values[i]!=null?`<br><i style="background:${line.color}"></i>${esc(line.name)}: <b>${fmt(line.values[i],1)}</b>`:''),ev)},
    ()=>hideTip())},0);
  return`<svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name||'')}">${g}</svg>`;
}

// Оплаченные заявки, созданные в днях a..b, — какими они были на день asOf: первая оплата не позже asOf (с той же долей суток,
// что прошла сегодня к сборке). Прошлый период иначе «созревает» дольше текущего и всегда выглядит лучше (Т1, ревью 17.10).

function paidAsOf(a,b,asOf){

/** Линейный тренд заявок по полным месяцам (первый неполный месяц данных и текущий не участвуют в расчёте, но линия идёт через все). */
function monTrend(ms){
  const vals=ms.map(m=>rs(D.zav.total,m.a,m.b));
  const full=ms.map((m,i)=>i).filter(i=>{const m=ms[i];return D.days[m.b]!==D.today&&(!D.zav_from||D.days[m.a]>=D.zav_from)&&D.days[m.a].slice(8)==='01'&&(i>0||!D.zav_from||D.zav_from.slice(8)==='01')});
  if(full.length<3)return null;
  const n=full.length,mx=full.reduce((a,i)=>a+i,0)/n,my=full.reduce((a,i)=>a+vals[i],0)/n;

}

  const paidNow=paidAsOf(r.a,r.b,ti),paidM=paidNow.n,paidFull=paidAsOf(r.a,r.b-1,ti).n,paidPrev=r.pa>=0?paidAsOf(r.pa,r.pb-1,r.pb).n:null;
  const visM=rs(D.site.visits,r.a,r.b-1),visPrev=rs(D.site.visits,r.pa,r.pb-1);   // без сегодняшнего дня — и в прошлом месяце на день меньше
  const crM=visM?rs(z,r.a,r.b-1)/visM:null,crPrev=visPrev?rs(z,r.pa,r.pb-1)/visPrev:null;
  const pPer=r.pa>=0&&r.pb>=0?`${+D.days[r.pa].slice(8)}–${+D.days[r.pb].slice(8)}\u00a0${MON_G[+D.days[r.pb].slice(5,7)-1]}`:"прошлый месяц";   // те же дни прошлого месяца: «1–8 сен»
  const planTxt=f.plan?`план ${fmt(f.plan)} · ${f.forecast>=f.plan?'<span class="delta up">выходим на план</span>':`<span class="delta dn">не хватает ${fmt(f.plan-f.forecast)}</span> · нужно ${fmt(f.need_per_day,1)} в день`}`:'<span class="muted">плана нет — лист «План»</span>';
  // последний рабочий день до сегодняшнего (сб/вс пропускаем; праздники не учитываются) и рабочий день перед ним
  const isWd=i=>{const g=new Date(D.days[i]+'T12:00:00Z').getUTCDay();return g>0&&g<6};
  const prevWd=i=>{i--;while(i>0&&!isWd(i))i--;return i};
  const wd1=prevWd(ti),wd2=prevWd(wd1);
  const wdL=[];for(let i=Math.max(0,ti-28);i<ti;i++)if(isWd(i))wdL.push(z[i]);
  const wdMean=wdL.length?wdL.reduce((a,b)=>a+b,0)/wdL.length:null;
  const wdLbl=wd1===ti-1?'Заявок вчера':'Заявок в последний будний день';
  // вывод одной фразой: куда идёт месяц и что просело за неделю
  const sigBad=D.signals.items.filter(s=>s.level==='bad'||s.level==='warn').sort((a,b)=>(a.level==='bad'?0:1)-(b.level==='bad'?0:1));
  const vsPrev=f.prev_month?Math.round((f.forecast/f.prev_month-1)*100):null,monU=MON[+f.month.slice(5)-1];
  const verdict=`${monU[0].toUpperCase()+monU.slice(1)} идёт к <b>${fmt(f.forecast)}</b> ${plural(f.forecast,'заявке','заявкам','заявкам')}${f.err_typ!=null?` (обычно ±${fmt(f.err_typ*100,0)}%)`:''}`+
    (f.plan?(f.forecast>=f.plan?' — выходим на план':` — до плана не хватает ${fmt(f.plan-f.forecast)}`):vsPrev!=null?` — ${vsPrev>=0?'+':'−'}${Math.abs(vsPrev)}% к прошлому месяцу`:'')+
    `. ${sigBad.length?`За неделю просело: ${sigBad.slice(0,2).map(s=>`<b>${esc(s.name.toLowerCase())}</b>`).join(', ')}.`:'За неделю всё в норме.'}`;
  let h=`<p class="verdict">${verdict}</p><div class="grid g-kpi">
    <div class="panel kpi go" data-go="sum-daily" title="Заявки по дням"><div class="lbl">${wdLbl}, ${dShort(D.days[wd1])}</div><div class="val">${fmt(z[wd1])}<small>${delta(z[wd1],wdMean)}</small></div>
      <div class="foot"><span>обычно ${fmt(wdMean,1)} в будний день (среднее за 4 недели)</span></div>
      <div class="foot"><span class="muted">${dShort(D.days[wd2])} было ${fmt(z[wd2])} ${plural(z[wd2],'заявка','заявки','заявок')}${wd1===ti-1?'':(n=>` · за выходные ${fmt(n)} ${plural(n,'заявка','заявки','заявок')}`)(rs(z,wd1+1,ti-1))}</span></div></div>
    <div class="panel kpi go" data-go="sum-fc" title="Прогноз месяца"><div class="lbl">Заявок за ${MON[+f.month.slice(5)-1]}</div><div class="val">${fmt(f.fact)}<small>${fullTxt&&prevTxt?delta(zFull,zPrev):delta(null,null)}</small></div>
      <div class="foot"><span>${fullTxt&&prevTxt?`к ${prevTxt}: ${fmt(zPrev)} ${plural(zPrev,'заявка','заявки','заявок')}`:'сравнение — со 2-го числа'}</span></div>
      <div class="foot"><span class="muted">без сегодняшнего дня · прогноз на месяц — ${fmt(f.forecast)} ${plural(f.forecast,'заявка','заявки','заявок')}</span></div></div>
    <div class="panel kpi go" data-go="@pay" title="Открыть «Оплаты»"><div class="lbl">Оплачено и предоплата</div><div class="val">${fmt(paidM)}<small>${fullTxt&&prevTxt?delta(paidFull,paidPrev):delta(null,null)}</small></div>
      <div class="foot"><span>${fullTxt&&prevTxt?`к ${prevTxt}: ${fmt(paidPrev)} ${plural(paidPrev,'заявка','заявки','заявок')}`:'сравнение — со 2-го числа'}</span></div>
      <div class="foot"><span class="muted" title="Прошлый месяц — какими были оплаты на тот же день: у его заявок не должно быть лишнего времени">заявки на ${rub(paidNow.rub)} · без сегодня, прошлый — оплаты к ${+D.days[Math.max(0,r.pb)].slice(8)}-му</span></div></div>
    <div class="panel kpi go" data-go="sum-cr" title="Конверсия сайта по неделям"><div class="lbl">Визит → заявка</div><div class="val">${pct(crM,2)}<small>${delta(crM,crPrev)}</small></div>
      <div class="foot"><span>к ${perTxt(r.pa,r.pb-1)||pPer}: ${pct(crPrev,2)}</span></div>
      <div class="foot"><span class="muted">заявки с сайта / визиты · без сегодняшнего дня</span></div></div>
  </div><!--jump-->`;
  // прогноз
  const dim=new Date(+f.month.slice(0,4),+f.month.slice(5,7),0).getDate();
  const labels=[],fact=[],fc=[],ly=[],plan=[];
  const lyStart=D.days.indexOf((+f.month.slice(0,4)-1)+f.month.slice(4)+'-01');
  let cum=0,lyCum=0;
  for(let dd=1;dd<=dim;dd++){const ds=f.month+'-'+String(dd).padStart(2,'0'),i=mStart+dd-1;labels.push(dShort(ds));
    if(i<=ti){cum+=z[i];fact.push(cum)}else fact.push(null);
    if(lyStart>=0&&D.zav_from&&D.days[lyStart]>=D.zav_from){lyCum+=z[lyStart+dd-1]||0;ly.push(lyCum)}else ly.push(null);
    plan.push(f.plan?f.plan*dd/dim:null)}
  // прогнозная линия: от факта сегодня до прогноза в конце месяца, по дням пропорционально
  const todayN=ti-mStart+1;
  for(let dd=1;dd<=dim;dd++){fc.push(dd<todayN?null:dd===todayN?fact[dd-1]:fact[todayN-1]+(f.forecast-fact[todayN-1])*(dd-todayN)/(dim-todayN||1))}
  const series=[{name:'Факт, накопительно',color:cssv('--s1'),values:fact,area:true},{name:'Прогноз',color:cssv('--s1'),values:fc,dash:true}];
  const lg=[['Факт',cssv('--s1')],['Прогноз',cssv('--s1'),'dash']];
  if(ly.some(v=>v!=null)){series.push({name:'Год назад',color:cssv('--s2'),values:ly});lg.push(['Год назад',cssv('--s2')])}
  if(f.plan){series.push({name:'План',color:cssv('--muted'),values:plan,dash:true});lg.push(['План',cssv('--muted'),'dash'])}
  h+=`<div class="grid g-2"><div class="panel sec" id="sum-fc"><h2>Прогноз на ${monName(f.month)}</h2>
    <div class="hero"><span class="big">${fmt(f.forecast)}</span><span class="rng">заявок · коридор ${fmt(f.low)}–${fmt(f.high)} · осталось дней: ${f.days_left}</span></div>${f.err_typ!=null?`<p class="sub" style="margin-top:4px">На это число месяца прогноз обычно ошибается на ±${fmt(f.err_typ*100,0)}% (проверено на ${f.err_n} прошлых ${plural(f.err_n,'месяце','месяцах','месяцах')}); коридор — 8 из 10 таких месяцев.</p>`:''}
    <p class="sub" style="margin-top:6px">${planTxt} · прошлый месяц ${fmt(f.prev_month)} · год назад ${f.last_year==null?'—':fmt(f.last_year)}${f.paid_forecast!=null?` · ожидаем оплат ≈ ${fmt(f.paid_forecast)} (доля оплат ${pct(f.pay_rate,0)})`:''}</p>
    ${legend(lg)}${lineChart('c-fc',{labels,series,ticks:i=>(i===0||(i+1)%5===0)?String(i+1):''})}
    <p class="note">Прогноз: факт + оставшиеся дни × среднее в день за 28 дней с поправкой на день недели. В начале месяца он грубый, к 20-му — точнее.</p></div>`;
  // где отвал
  const sg=D.signals,groups=['Заявки','Сайт','Обращения','После заявки'];
  h+=`<div class="panel sec" id="sum-sig"><h2>Где отвал</h2><p class="sub">Последние 7 дней (${dShort(sg.window[0])}–${dShort(sg.window[1])}) против нормы — 28 дней до них. Красный — падение больше 15% и не случайное. Нажмите на строку — откроется вкладка с подробностями.</p>
    <div class="grid" style="margin:0">${groups.filter(g=>sg.sides[g]).map(g=>`<div class="side"><h3 data-go="${SIG_GO[g]||''}" title="Подробнее">${g}<span class="pill l-${sg.sides[g]}">${LEVEL_TXT[sg.sides[g]]}</span></h3>
      <ul class="sig">${sg.items.filter(s=>s.group===g).map(s=>`<li class="${s.level}" data-go="${SIG_GO[g]||''}" title="Подробнее"><i></i><span>${esc(s.name)}</span><span class="v">${s.kind==='pct'?pct(s.value,s.value<0.05?2:1):fmt(s.value,1)}<small>обычно ${s.kind==='pct'?pct(s.norm,s.norm<0.05?2:1):fmt(s.norm,1)}</small></span></li>`).join('')}</ul></div>`).join('')}</div></div></div>`;
  // конверсия сайта по неделям (решение 22.10.2026): заявки с сайта / визиты Метрики за неделю пн–вс; с первой полной недели
  // после D.zav_from (01.06.2025 — воскресенье, первая неделя 02.06), до последней полной недели — текущая и сегодня не входят;
  // тренд — скользящая за 4 недели суммами (заявки за 4 недели / визиты за те же 4 недели), а не среднее процентов
  const zi=Math.max(0,D.days.indexOf(D.zav_from)),dow=i=>new Date(D.days[i]+'T12:00:00Z').getUTCDay();
  let w0=zi;while(w0<ti&&dow(w0)!==1)w0++;
  const WK=[];for(let i=w0;i+6<ti;i+=7)WK.push({a:i,z:rs(z,i,i+6),v:rs(D.site.visits,i,i+6)});
  const crW=WK.map(w=>w.v?w.z/w.v*100:null);
  const crT=WK.map((w,k)=>{if(k<3)return null;const L4=WK.slice(k-3,k+1),zz=sum(L4.map(x=>x.z)),vv=sum(L4.map(x=>x.v));return vv?zz/vv*100:null});
  const wLbl=w=>{const a=D.days[w.a],b=D.days[w.a+6];return`${dShort(a)} – ${dShort(b)} ${b.slice(0,4)} · ${fmt(w.z)} ${plural(w.z,'заявка','заявки','заявок')} / ${fmt(w.v)} ${plural(w.v,'визит','визита','визитов')}`};
  const lastT=crT[crT.length-1],prevT=crT.length>4?crT[crT.length-5]:null;
  // подпись — у самой высокой недели каждого месяца (месяц — по понедельнику недели)
  const peaks=[];WK.forEach((w,k)=>{if(crW[k]==null)return;const m=D.days[w.a].slice(0,7),last=peaks[peaks.length-1];
    if(!last||last.m!==m)peaks.push({m,i:k});else if(crW[k]>crW[last.i])last.i=k});
  if(WK.length>=4)h+=`<div class="panel sec" id="sum-cr" style="margin-bottom:16px"><h2>Конверсия сайта по неделям</h2><p class="sub">Заявки с сайта / визиты за неделю (пн–вс), с ${dShort(D.days[w0])} ${D.days[w0].slice(0,4)}; текущая неделя не входит. Тренд за 4 недели — сейчас <b>${fmt(lastT,2)}%</b>${prevT!=null?`, месяц назад ${fmt(prevT,2)}%`:''}</p>
    ${legend([['Неделя',cssv('--s1')],['Тренд за 4 недели',cssv('--s2')]])}
    ${lineChart('c-cr',{labels:WK.map(wLbl),series:[{name:'Неделя',color:cssv('--s1'),values:crW},{name:'Тренд за 4 недели',color:cssv('--s2'),values:crT}],ticks:i=>{const d=D.days[WK[i].a];return i===0||d.slice(5,7)!==D.days[WK[i-1].a].slice(5,7)?MON_S[+d.slice(5,7)-1]+(d.slice(5,7)==='01'||i===0?' '+d.slice(2,4):''):''},fmtV:v=>fmt(v,2)+'%',fmtA:v=>fmt(v,2)+'%',floor:0.01,height:260,marks:peaks.map(p=>({s:0,i:p.i}))})}
    <p class="note">Тренд — заявки за 4 недели, делённые на визиты за те же 4 недели: недели с большим трафиком весят больше. Прямую через все точки не рисуем — сезонность круизов дала бы ложный рост или падение.</p></div>`;
  // заявки по дням
  const from=Math.max(0,ti-59),lab=D.days.slice(from),vals=z.slice(from),avg=ma7(z).slice(from);
  h+=`<div class="panel sec" id="sum-daily"><h2>Заявки по дням</h2><p class="sub">60 дней; сегодня — неполный день</p>
    ${legend([['Заявки за день',cssv('--s1'),'bar'],['Среднее за 7 дней',cssv('--s2')]])}
    ${barChart('c-daily',{name:'Заявок',color:cssv('--s1'),bars:vals.map((v,i)=>({label:dShort(lab[i])+(from+i===ti?' (сегодня)':''),value:v})),line:{name:'Среднее за 7 дней',color:cssv('--s2'),values:avg},ticks:i=>i%7===0?dShort(lab[i]):''})}</div>`;
  $('#view').innerHTML=withJump(h,[['sum-fc','Прогноз'],['sum-sig','Где отвал'],...(WK.length>=4?[['sum-cr','Конверсия сайта']]:[]),['sum-daily','По дням']]);
}

function vZav(){
  const r=range(S.period),cur=reqIn(r.a,r.b),okZ=since(r,D.zav_from),prev=okZ?reqIn(r.pa,r.pb):[];
  const stat=rows=>{const paid=rows.filter(x=>x[1]===1),lost=rows.filter(x=>x[1]===0||x[1]===3);
    return{n:rows.length,paid:paid.length,lost:lost.length,rub:sum(paid.map(x=>x[2])),margin:sum(paid.map(x=>x[3])),check:paid.length?sum(paid.map(x=>x[2]))/paid.length:null}};
  const c=stat(cur),p=okZ?stat(prev):{n:null,paid:null,lost:null,check:null};
  let h=`<div class="grid g-kpi">
    <div class="panel kpi go" data-go="zav-mon" title="Заявки по месяцам"><div class="lbl">Заявок</div><div class="val">${fmt(c.n)}<small>${delta(c.n,p.n)}</small></div>${cmpLine(r,okZ,nw(p.n,'заявка','заявки','заявок'))}${mutedLine('заявки сайта в букинге, по дате создания')}</div>
    <div class="panel kpi go" data-go="@pay" title="Открыть «Оплаты»"><div class="lbl">Оплачено и предоплата</div><div class="val">${fmt(c.paid)}<small>${delta(c.paid,p.paid)}</small></div>${cmpLine(r,okZ,nw(p.paid,'заявка','заявки','заявок'))}${mutedLine(`${pct(c.n?c.paid/c.n:null,0)} от заявок · на ${rub(c.rub)}`)}</div>
    <div class="panel kpi go" data-go="@pay" title="Открыть «Оплаты»"><div class="lbl">Аннулировано и возвраты</div><div class="val">${fmt(c.lost)}<small>${delta(c.lost,p.lost,{inverse:true})}</small></div>${cmpLine(r,okZ,nw(p.lost,'заявка','заявки','заявок'))}${mutedLine(`${pct(c.n?c.lost/c.n:null,0)} от заявок`)}</div>
    <div class="panel kpi go" data-go="zav-ship" title="Чек по теплоходам"><div class="lbl">Средний чек оплаченных</div><div class="val">${rub(c.check)}<small>${delta(c.check,p.check)}</small></div>${cmpLine(r,okZ,rub(p.check))}${mutedLine(`маржа ${rub(c.margin)}`)}</div>
  </div><!--jump-->`;
  // по месяцам
  const ms=monthsOf().filter(m=>!D.zav_from||m.m>=D.zav_from.slice(0,7));
  h+=`<div class="panel sec" id="zav-mon" style="margin-bottom:16px"><h2>Заявки по месяцам</h2><p class="sub">По дате создания заявки; оплаченные — текущий статус «Оплачено» / «Предоплата». Последний месяц неполный. Нажмите на столбик — период станет этим месяцем.</p>
    ${legend([['Оплачены',cssv('--s3'),'bar'],['Остальные: аннулированы, возвраты, в работе',cssv('--s1'),'bar'],['Тренд всех заявок',cssv('--s2'),'dash']])}
    ${barChart('c-mon',{name:'Всего заявок',line:monTrend(ms),color:cssv('--s1'),bars:ms.map(m=>{const t=rs(D.zav.total,m.a,m.b),pd=rs(D.zav.paid,m.a,m.b);return{label:monName(m.m),value:t,inner:pd,innerColor:cssv('--s3'),tip:`<i style="background:${cssv('--s3')}"></i>Оплачены: <b>${fmt(pd)}</b> (${pct(t?pd/t:null,0)})<br><i style="background:${cssv('--s1')}"></i>Остальные: <b>${fmt(t-pd)}</b>`}}),ticks:i=>monShort(ms[i].m)})}</div>`;
  // разрезы
  const cut=(title,keyFn,order,all)=>{const g={};cur.forEach(x=>{const k=keyFn(x);if(k==null)return;(g[k]=g[k]||[]).push(x)});
    let keys=Object.keys(g);keys=order?order.filter(k=>g[k]):keys.sort((a,b)=>g[b].length-g[a].length);
    if(!keys.length)return`<div class="panel"><h2>${title}</h2><div class="empty">Нет заявок за период.</div></div>`;
    return`<div class="panel"><h2>${title}</h2><div class="tbl"><table><thead><tr><th></th><th class="r">Заявок</th><th class="r">Доля</th><th class="r">Оплачено</th><th class="r">Ср. чек</th></tr></thead><tbody>${(all?keys:keys.slice(0,12)).map(k=>{const s=stat(g[k]);
      return`<tr><td class="b">${esc(k)}</td><td class="r">${fmt(s.n)}</td><td class="r">${pct(s.n/c.n,0)}</td><td class="r">${pct(s.n?s.paid/s.n:null,0)}</td><td class="r">${rub(s.check)}</td></tr>`}).join('')}</tbody></table></div></div>`};
  const lead=x=>x[7]==null?null:x[7]<=14?'до 14 дней':x[7]<=30?'15–30 дней':x[7]<=60?'31–60 дней':x[7]<=120?'61–120 дней':'больше 120 дней';
  const dur=x=>x[8]==null?null:x[8]<=3?'1–3 дня':x[8]<=7?'4–7 дней':x[8]<=14?'8–14 дней':'15+ дней';
  h+=zavCohort(r);
  // слева столбиком четыре разреза, справа одна длинная таблица теплоходов; на телефоне — одной колонкой
  h+=`<div class="grid zcuts"><div class="zcuts-l sec" id="zav-cuts">${cut('Первая заявка или уже оформлял',x=>x[5]?'Первая заявка':'Уже оформлял')}${cut('Оператор',x=>x[6]?'Созвездие':'Другие операторы через сайт')}
    ${cut('За сколько до отплытия',lead,['до 14 дней','15–30 дней','31–60 дней','61–120 дней','больше 120 дней'])}${cut('Длительность круиза',dur,['1–3 дня','4–7 дней','8–14 дней','15+ дней'])}</div>
    <div class="sec" id="zav-ship">${cut('Теплоход',x=>D.requests.ships[x[4]],null,true)}</div></div>`;
  $('#view').innerHTML=withJump(h,[['zav-mon','По месяцам'],...(D.zcoh&&D.zcoh.p?[['zav-coh','Когорта']]:[]),['zav-cuts','Клиенты, сроки, длительность'],['zav-ship','Теплоходы']]);
  chartPick('c-mon',ms.length,i=>pickState({period:'m:'+ms[i].m},'zav-mon'));
  const zk=$('#seg-zkind');if(zk)zk.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;if(e.detail)b.blur();S.zkind=b.dataset.k;save();render()};
  const zc=$('#chk-zct');if(zc)zc.onchange=e=>{const t=e.target.dataset&&e.target.dataset.t;if(!t)return;const st=new Set(S.zct);if(e.target.checked)st.add(t);else st.delete(t);S.zct=[...st];save();render()};
}

/* Когорта заявок сайта (22.10.2026, D.zcoh — ночной расчёт sa_zav_cohort.js): люди с заявкой сайта в периоде; день 0 — их первая
   заявка сайта в периоде; группа — по истории до дня 0; после — все их заявки с дня 0 (сама заявка сайта тоже), сроки от дня 0.
   p = [[дни заявок сайта], первая заявка, первый круиз, [дни круизов СЗ], [[день, тип, тип клиента, день оплаты|-1, СЗ]]], дни — от zcoh.from */
const ZCOH={data:()=>D.zcoh,id:'zav-coh',kind:'zkind',ct:'zct',excl:true,name:'Когорта заявок сайта',title:'Когорта: кто оставил заявку на сайте и когда купил',
  wait:'Считается по Букингу ночью (лист «Заявки сайта: когорта») или сразу — меню таблицы «Заявки» → «Заявки сайта: пересчитать когорту».',none:'Нет заявок сайта за период.',col:'Кем был в день заявки',
  sub:A=>`Люди, оставившие заявку на сайте за период (${fmt(A.n)}), — кем они были в день своей первой заявки сайта в этом периоде («покупал» — по круизам) и что оформили и оплатили потом. В ячейке — <b>заявок / оплачено заявок</b> за срок после дня заявки, сама заявка сайта входит; ниже — доля Созвездия в оплаченных.`,
  notes:({ex})=>`<li><b>День 0</b> — первая заявка сайта человека в выбранном периоде; две заявки за период — человек один. Человек — аккаунт в Букинге (как «Первая заявка» ниже).</li>
      <li><b>Новые</b> — до дня 0 заявок не было; почти то же, что «Первая заявка» в таблице ниже, только в людях (там чуть меньше: если в тот же день раньше была заявка не с сайта, это уже не первая заявка). <b>Оформлял, не покупал</b> — заявки были, состоявшихся круизов нет.</li>
      <li><b>Купили, людей</b> — оплатили хотя бы одну заявку с дня 0 (сама заявка сайта тоже считается), человек один раз.</li>
      <li><b>Заявок / оплачено заявок</b> — заявки, созданные за срок после дня 0 / оплаченные (Предоплата или Оплачено; срок — по дню первой оплаты). <b>СЗ %</b> — Созвездие и Речные линии.</li>
      <li><b>рано</b> — срок ещё не наступил; <b>*</b> — наступил не для всех: у заявок конца периода он ещё идёт, число будет расти.${ex}</li>`};
/* Когорта обращений (23.10.2026, D.ocoh — ночной расчёт sa_obr_cohort.js): люди с обращением в периоде (звонок, Макс, Телеграм; без дублей
   и ошибок, как карточка «Обращения»); человек — контакт Битрикса, в Букинге — покупатель заявки из лида/сделки и покупатели с тем же телефоном или почтой; день 0 — первое
   обращение в периоде; p[5]: 0 — нет телефона, почты и номера заявки, 1 — не нашли в Букинге, 2 — нашли. */
const OCOH={data:()=>D.ocoh,id:'obr-coh',kind:'okind',ct:'oct',name:'Когорта обращений',title:'Когорта: кто обратился и когда купил',
  wait:'Считается по Битриксу и Букингу ночью (лист «Обращения: когорта») или сразу — меню таблицы «Заявки» → «Обращения: пересчитать когорту».',none:'Нет обращений за период.',col:'Кем был в день обращения',
  newHint:'заявок не было или не нашли в Букинге',
  sub:A=>`Люди, обратившиеся за период (${fmt(A.n)}): звонок, Макс, Телеграм, — кем они были в день своего первого обращения в этом периоде («покупал» — по круизам) и что оформили и оплатили потом. В ячейке — <b>заявок / оплачено заявок</b> за срок после дня обращения; ниже — доля Созвездия в оплаченных.`,
  notes:({cov})=>`<li><b>День 0</b> — первое обращение человека в выбранном периоде; два обращения за период — человек один. Человек — контакт в Битриксе; контакты с общим телефоном или почтой — один человек.</li>
      <li><b>Как нашли в Букинге</b> — покупатель заявки, номер которой стоит в лиде или сделке Битрикса, и покупатели с тем же телефоном или почтой. Нашли ${fmt(cov[2])} из ${fmt(cov[0]+cov[1]+cov[2])} (${pct(cov[0]+cov[1]+cov[2]?cov[2]/(cov[0]+cov[1]+cov[2]):null,0)}); не нашли — ${fmt(cov[1])}, в Битриксе нет ни телефона, ни почты, ни номера заявки — ${fmt(cov[0])}. Ненайденные — в «Новых».</li>
      <li><b>Оформлял, не покупал</b> — заявки были, состоявшихся круизов нет. <b>Купили, людей</b> — оплатили хотя бы одну заявку, созданную с дня 0, человек один раз. Это все покупки человека, а не только заявка из лида, поэтому оплаченных больше, чем в карточке «Оплачены».</li>
      <li><b>Заявок / оплачено заявок</b> — заявки, созданные за срок после дня 0 / оплаченные (Предоплата или Оплачено; срок — по дню первой оплаты). <b>СЗ %</b> — Созвездие и Речные линии.</li>
      <li><b>рано</b> — срок ещё не наступил; <b>*</b> — наступил не для всех: у обращений конца периода он ещё идёт, число будет расти.</li>`};
function zavCohort(r){return cohortBlock(r,ZCOH)}
/** Общий блок когорты (заявки сайта, обращения): c — подписи, ключи состояния и id; p[5] (если есть) — нашли ли человека в Букинге. */
function cohortBlock(r,c){
  const Z=c.data();
  if(!Z||!Z.p)return`<div class="panel sec" id="${c.id}" style="margin-bottom:16px"><h2>${c.name}</h2><div class="empty">${Z&&Z.error?'Не прочитана: '+esc(Z.error):c.wait}</div></div>`;
  const off0=Math.round((Date.UTC(+Z.from.slice(0,4),+Z.from.slice(5,7)-1,+Z.from.slice(8,10))-Date.UTC(+D.days[0].slice(0,4),+D.days[0].slice(5,7)-1,+D.days[0].slice(8,10)))/864e5);
  const a=r.a-off0,b=r.b-off0,left=D.days.length-1-r.b,leftA=D.days.length-1-r.a;   // дни периода в счёте zcoh; сколько дней прошло после конца / начала
  const LAGB=[[0,7],[8,30],[31,90],[91,180],[181,365],[366,1e9]],lagI=d=>LAGB.findIndex(([x,y])=>d>=x&&d<=y),SEGK=['new','base','other','sz','back'];
  const ppl=[];
  const cov=[0,0,0];
  Z.p.forEach(([sd,f0,fc,szd,rs,m])=>{const A=sd.find(d=>d>=a&&d<=b);if(A==null)return;if(m!=null)cov[m]++;
    let si;if(fc!=null&&fc<A){const last=szd.filter(d=>d<A).pop();si=last==null?2:A-last<730?3:4}else si=f0!=null&&f0<A?1:0;
    ppl.push([si,rs.filter(x=>x[0]>=A).map(x=>[x[1],x[2],x[0]-A,x[3]>=0?x[3]-A:-1,x[4]])])});
  const CTL=[['p','Частные лица'],['i','ИП'],['s','Самозанятые'],['g','Агентства']];
  const ctHave=CTL.filter(([t])=>ppl.some(p=>p[1].some(x=>x[1]===t)));
  if(!Array.isArray(S[c.ct]))S[c.ct]=CTL.map(x=>x[0]);
  const ctOn=new Set(S[c.ct]);
  const agg=kk=>{const z=()=>({n:0,buyers:0,req:[0,0,0,0,0,0],sale:[0,0,0,0,0,0],saleSz:[0,0,0,0,0,0]}),o={all:z()};SEGK.forEach(k=>o[k]=z());
    const kt=kk==='air'?'a':kk,keepK=kk==='all'?()=>true:t=>t===kt;
    ppl.forEach(([si,rs])=>{const f=rs.filter(x=>keepK(x[0])&&(ctOn.has(x[1])||x[1]==='o'));
      [o.all,o[SEGK[si]]].forEach(x=>{x.n++;if(f.some(y=>y[3]>=0))x.buyers++;
        f.forEach(y=>{const i=lagI(y[2]);if(i>-1)x.req[i]++;if(y[3]>=0){const j=lagI(y[3]);if(j>-1){x.sale[j]++;if(y[4])x.saleSz[j]++}}})})});
    return o};
  const WKT=[['c','Круизы','круиз','круизы'],['x','Доп. услуги','доп. услугу','доп. услуги к круизу'],['v','Билеты на теплоход','билет на теплоход','билеты «В гости на теплоход»'],['s','Сертификаты','сертификат','сертификаты'],['air','Авиабилеты','авиабилеты','авиабилеты'],['z','Визы','визу','визы'],['o','Прочее','прочее','прочие заявки без круиза'],['all','Всё вместе','что угодно','все заявки']];
  const has=k=>k==='c'||k==='all'||ppl.some(p=>p[1].some(x=>x[0]===(k==='air'?'a':k))),C={},get=k=>C[k]||(C[k]=agg(k));
  const WK=WKT.filter(([k])=>has(k));if(!WK.some(x=>x[0]===S[c.kind]))S[c.kind]='c';
  const wk=S[c.kind],SG=get(wk),A=SG.all,wt=WKT.find(x=>x[0]===wk),sum=v=>v.reduce((x,y)=>x+y,0);
  const SEG_L=[['all','Всего',''],['new','Новые',c.newHint||'заявок раньше не было'],['base','Оформлял, не покупал','заявки были, круизов не было'],['other','Покупали не Созвездие','только у других операторов'],['sz','Покупатели Созвездия','последняя покупка СЗ — меньше 2 лет назад'],['back','Вернувшиеся','последняя покупка СЗ — 2 года назад и раньше']];
  const lab=LAGB.map(([x,y])=>y>1e8?(x-1)+'+':x+'–'+y);
  // срок не наступил ни для кого (с начала периода прошло меньше) — «рано»; наступил не для всех — звёздочка в заголовке
  const early=i=>leftA<LAGB[i][0],part=i=>!early(i)&&left<LAGB[i][1]&&LAGB[i][1]<1e8;
  const cell=(q,s,sz,i)=>i!=null&&early(i)?'<span class="muted">рано</span>':q||s?`${fmt(q)} / <b>${fmt(s)}</b><small>${s?'СЗ '+pct(sz/s,0):'&nbsp;'}</small>`:'<span class="muted">—</span>';
  const bar=`<div class="filters" style="margin:4px 0 10px">${WK.length>1?`<div><span class="flbl">Что считаем</span><div class="seg wk" id="seg-${c.kind}">${WK.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${wk===k}">${l}<small>${fmt(get(k).all.buyers)}</small></button>`).join('')}</div></div>`:''}${ctHave.length>1?`<div class="fgroup"><span class="flbl">Тип клиента</span><div class="checks" id="chk-${c.ct}" role="group" aria-label="Тип клиента">${ctHave.map(([t,l])=>`<label><input type="checkbox" data-t="${t}"${ctOn.has(t)?' checked':''}>${l}</label>`).join('')}</div></div>`:''}</div>`;
  const ex=!c.excl?'':Z.excl&&Z.excl.accounts?` Не считаются служебные аккаунты Букинга (у одного аккаунта больше 20 разных покупателей): ${fmt(Z.excl.accounts)}, их заявок сайта с ${esc(dShort(Z.from))} ${Z.from.slice(0,4)} — ${fmt(Z.excl.site)}.`:'';
  if(!A.n)return`<div class="panel sec" id="${c.id}" style="margin-bottom:16px"><h2>${c.name}</h2><div class="empty">${a<0&&b<0?'Когорта считается с '+esc(dShort(Z.from))+' '+Z.from.slice(0,4)+'.':c.none}</div></div>`;
  return`<div class="panel sec" id="${c.id}" style="margin-bottom:16px"><h2>${c.title} <span class="muted" style="font-weight:400">· ${esc(wt[3])}</span></h2>${bar}
    <p class="sub">${c.sub(A)} Обновлено ${Z.updated?esc(dShort(Z.updated.slice(0,10))):'—'}.</p>
    <div class="tbl segt"><table><thead><tr><th>${c.col}</th><th class="r">Людей</th><th class="r">Купили, людей</th>${lab.map((l,i)=>`<th class="r lag${i?'':' gl'}">${esc(l)} дн.${part(i)?'*':''}</th>`).join('')}<th class="r gl">Всего: заявок / оплачено заявок</th></tr></thead>
    <tbody>${SEG_L.map(([key,name,hint])=>{const x=SG[key];if(!x||(!x.n&&key!=='all'))return'';
      return`<tr class="${key==='all'?'b':''}"><td>${esc(name)}${hint?`<small>${esc(hint)}</small>`:''}</td><td class="r" data-l="Людей">${fmt(x.n)}${key!=='all'?`<small>${pct(A.n?x.n/A.n:null,0)} людей</small>`:''}</td>
      <td class="r" data-l="Купили, людей">${fmt(x.buyers)}<small>${pct(x.n?x.buyers/x.n:null,1)} группы</small></td>
      ${lab.map((l,i)=>`<td class="r lag${i?'':' gl'}" data-l="${esc(l)} дн.${part(i)?'*':''}">${cell(x.req[i],x.sale[i],x.saleSz[i],i)}</td>`).join('')}<td class="r gl" data-l="Всего">${cell(sum(x.req),sum(x.sale),sum(x.saleSz))}</td></tr>`}).join('')}</tbody></table></div><p class="segt-m">По срокам (0–7 дней, 8–30 и дальше) — в полной версии на компьютере.</p>
    <ul class="sub" style="margin:10px 0 0;padding-left:18px;line-height:1.55">
      ${c.notes({ex,cov})}
    </ul></div>`;
}

function vSite(){
  const r0=range(S.period),b=Math.min(r0.b,D.days.length-2);   // без сегодняшнего неполного дня
  const r=Object.assign({},r0,{pb:r0.pb>=0?r0.pb-(r0.b-b):r0.pb});   // и в прошлом периоде столько же дней
  const steps=Object.keys(D.site.steps);
  // с какого дня периода есть данные: конверсию считаем только там, где есть и визиты, и заявки (и шаги воронки)
  const startIdx=d=>d?Math.max(r.a,D.days.indexOf(d)<0?(d>D.today?Infinity:0):D.days.indexOf(d)):r.a;
  const za=startIdx(D.zav_from),fa=Math.max(za,startIdx(D.site.steps_from));
  const hasSteps=!!D.site.steps_from&&fa<=b;
  const vis=rs(D.site.visits,r.a,b),pvis=rs(D.site.visits,r.pa,r.pb);
  const okZ=since(r,D.zav_from);
  const zav=rs(D.zav.total,r.a,b),pzav=okZ?rs(D.zav.total,r.pa,r.pb):null;
  const visZ=rs(D.site.visits,za,b);   // визиты за те же дни, где уже есть заявки
  let h=`<div class="grid g-kpi">
    <div class="panel kpi go" data-go="site-days" title="Визиты по дням"><div class="lbl">Визиты</div><div class="val">${fmt(vis)}<small>${delta(vis,pvis)}</small></div>${cmpLine(r,r.pa>=0,nw(pvis,'визит','визита','визитов'))}${mutedLine('Метрика · без сегодняшнего дня')}</div>
    <div class="panel kpi go" data-go="@zav" title="Открыть «Заявки»"><div class="lbl">Заявки с сайта</div><div class="val">${fmt(zav)}<small>${delta(zav,pzav)}</small></div>${cmpLine(r,okZ,nw(pzav,'заявка','заявки','заявок'))}${mutedLine('букинг · без сегодняшнего дня')}</div>
    <div class="panel kpi go" data-go="site-funnel" title="Воронка сайта"><div class="lbl">Визит → заявка</div><div class="val">${pct(visZ?zav/visZ:null,2)}<small>${delta(visZ?zav/visZ:null,pvis&&pzav!=null?pzav/pvis:null)}</small></div>${cmpLine(r,okZ&&!!pvis,pct(pvis&&pzav!=null?pzav/pvis:null,2))}${mutedLine('заявки / визиты'+(za>r.a?` · с ${dShort(D.days[za])} ${D.days[za].slice(0,4)}, когда появились заявки`:''))}</div>
  </div><!--jump-->`;
  // воронка
  if(steps.length&&hasSteps){
    const rows=[['Визиты',D.site.visits]].concat(steps.map(g=>[g.replace(/^VBI_Клик_/,''),D.site.steps[g]])).concat([['Заявка создана',D.zav.total]]);
    const okP=since(r,D.site.steps_from)&&since(r,D.zav_from);
    const vals=rows.map(([_,arr])=>rs(arr,fa,b)),pvals=rows.map(([_,arr])=>okP?rs(arr,r.pa,r.pb):0);
    let worst=-1,worstCh=0;
    const html=rows.map(([name],i)=>{const v=vals[i],cr=i?(vals[i-1]?v/vals[i-1]:null):null,pcr=i?(pvals[i-1]?pvals[i]/pvals[i-1]:null):null;
      const ch=cr!=null&&pcr?(cr-pcr)/pcr:null;if(i&&ch!=null&&ch<worstCh){worstCh=ch;worst=i}
      return{name,v,cr,pcr,ch}});
    h+=`<div class="panel sec" id="site-funnel" style="margin-bottom:16px"><h2>Воронка сайта: от визита до заявки</h2><p class="sub">${fa>r.a?`Считается с ${dShort(D.days[fa])} ${D.days[fa].slice(0,4)} — раньше целей воронки в Метрике нет. `:''}Цифра справа — конверсия из предыдущего шага и её изменение к прошлому периоду${worst>0?`. Сильнее всего просел шаг «${esc(html[worst].name)}»`:''}.</p>
      <div class="funnel">${html.map((s,i)=>`<div class="row"><span>${esc(s.name)}</span><div class="bar"><i style="width:${i===0?100:Math.max(0.5,Math.min(100,s.v/(vals[1]||1)*100))}%;${i===0?'background:var(--s1-soft)':''}"></i></div><span class="n">${fmt(s.v)}</span><span class="cr">${i?`${pct(s.cr,1)} ${s.ch==null?'':`<span class="delta ${s.ch<-0.005?'dn':s.ch>0.005?'up':'eq'}">${s.ch>0?'▲':s.ch<0?'▼':'='}${fmt(Math.abs(s.ch)*100,0)}%</span>`}`:''}</span></div>`).join('')}</div>
      <p class="note">Полоса визитов — светлая и в своём масштабе; шаги сравниваются с первым кликом «Цены и бронирование».${(html[html.length-1].cr||0)>1?' Заявок больше, чем «Оформлений» в Метрике: заявки считаются по букингу, а цель Метрики срабатывает не у всех (блокировщики, отказ от cookie) — поэтому последний шаг выше 100%.':''}</p></div>`;
  } else h+=`<div class="panel sec" id="site-funnel" style="margin-bottom:16px"><h2>Воронка сайта</h2><div class="empty">Цели воронки в Метрике есть с ${D.site.steps_from?dShort(D.site.steps_from)+' '+D.site.steps_from.slice(0,4):'—'}. Выберите период позже этой даты.</div></div>`;
  // источники и устройства: месяцы, попадающие в период
  const mi=D.site.months.map((m,i)=>[m,i]).filter(([m])=>m>=D.days[r.a].slice(0,7)&&m<=D.days[b].slice(0,7)).map(x=>x[1]);
  const tbl=(title,obj)=>{const rows=Object.entries(obj).map(([k,v])=>[k,sum(mi.map(i=>v.visits[i])),sum(mi.map(i=>v.final[i]))]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const tv=sum(rows.map(x=>x[1]));
    return`<div class="panel"><h2>${title}</h2><p class="sub">Целые месяцы периода; «Оформление» — последний шаг воронки</p><div class="tbl"><table><thead><tr><th></th><th class="r">Визиты</th><th class="r">Доля</th><th class="r">Оформление</th><th class="r">CR</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="b">${esc(x[0])}</td><td class="r">${fmt(x[1])}</td><td class="r">${pct(x[1]/tv,0)}</td><td class="r">${fmt(x[2])}</td><td class="r">${pct(x[1]?x[2]/x[1]:null,2)}</td></tr>`).join('')}</tbody></table></div></div>`};
  h+=`<div class="grid g-2 sec" id="site-src">${tbl('Источники трафика',D.site.by_source)}${tbl('Устройства',D.site.by_device)}</div>`;
